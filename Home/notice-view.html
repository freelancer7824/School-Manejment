<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নোটিশ - ONNO ROKOM BIDDYANIKETON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary-color: #008779;
            --primary-dark: #00695c;
            --secondary-accent: #ffc107;
        }

        body {
            font-family: 'Roboto', sans-serif;
        }

        .primary-bg { background-color: var(--primary-color); }
        .primary-text { color: var(--primary-color); }
        .accent-bg { background-color: var(--secondary-accent); }
        .accent-text { color: var(--secondary-accent); }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notice-content {
            line-height: 1.8;
        }

        .notice-content p {
            margin-bottom: 1rem;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col bg-gray-50">
    <header class="primary-bg text-white shadow-lg">
        <nav class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-graduation-cap text-3xl accent-text"></i>
                <a href="home.html" class="text-xl font-black">ONNO ROKOM BIDDYANIKETON</a>
            </div>

            <ul class="hidden md:flex space-x-6 text-sm font-semibold">
                <li><a href="home.html" class="py-2 hover:border-b-2 hover:border-yellow-500">হোম</a></li>
                <li><a href="#" class="py-2 hover:border-b-2 hover:border-yellow-500">আমাদের সম্পর্কে</a></li>
                <li><a href="#" class="py-2 hover:border-b-2 hover:border-yellow-500">একাডেমিক</a></li>
                <li><a href="all-notice.html" class="py-2 border-b-2 border-yellow-500">নোটিশ</a></li>
                <li><a href="#" class="py-2 hover:border-b-2 hover:border-yellow-500">গ্যালারি</a></li>
                <li><a href="#" class="py-2 hover:border-b-2 hover:border-yellow-500">যোগাযোগ</a></li>
            </ul>
        </nav>
    </header>

    <main class="flex-1 container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <a href="all-notice.html" class="inline-flex items-center primary-text hover:underline mb-6">
                <i class="fas fa-arrow-left mr-2"></i> সকল নোটিশে ফিরে যান
            </a>

            <div class="bg-white rounded-xl shadow-lg p-6 md:p-8">
                <div id="notice-content">
                    <div class="loader"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="primary-bg text-white mt-12 pt-8 pb-6">
        <div class="container mx-auto px-4 text-center text-sm">
            &copy; ২০২৫ ONNO ROKOM BIDDYANIKETON. সর্বস্বত্ব সংরক্ষিত।
        </div>
    </footer>

    <script>
        // Firebase কনফিগারেশন
        const firebaseConfig = {
    apiKey: "AIzaSyCA6d95VTLNo_FAEzJCoOzuEhHCl5LeSqk",
    authDomain: "school-menejment.firebaseapp.com",
    projectId: "school-menejment",
    storageBucket: "school-menejment.firebasestorage.app",
    messagingSenderId: "348342436525",
    appId: "1:348342436525:web:41fc72cb02f824baa3bc24",
    measurementId: "G-GS91N1J5SH"
};

        // Firebase ইনিশিয়ালাইজেশন
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // URL থেকে নোটিশ ID পড়া
        function getNoticeIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // নির্দিষ্ট নোটিশ লোড করার ফাংশন
        function loadNotice() {
            const noticeId = getNoticeIdFromURL();
            const noticeContent = document.getElementById('notice-content');
            
            if (!noticeId) {
                noticeContent.innerHTML = `
                    <div class="text-center py-8 text-red-500">
                        <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
                        <h2 class="text-2xl font-bold mb-2">নোটিশ পাওয়া যায়নি</h2>
                        <p>অনুগ্রহ করে সঠিক নোটিশ লিঙ্ক ব্যবহার করুন</p>
                    </div>
                `;
                return;
            }

            database.ref('notices/' + noticeId).once('value').then((snapshot) => {
                const notice = snapshot.val();
                
                if (notice) {
                    document.title = `${notice.title} - ONNO ROKOM BIDDYANIKETON`;
                    
                    noticeContent.innerHTML = `
                        <div class="border-b pb-4 mb-6">
                            ${notice.isNew ? '<span class="bg-red-500 text-white text-sm px-3 py-1 rounded-full inline-block mb-3">নতুন</span>' : ''}
                            <h1 class="text-3xl font-bold primary-text mb-3">${notice.title}</h1>
                            <div class="flex items-center text-gray-600">
                                <i class="far fa-calendar-alt mr-2"></i>
                                <span>প্রকাশের তারিখ: ${notice.date}</span>
                            </div>
                        </div>
                        <div class="notice-content text-gray-700">
                            ${notice.description ? `
                                <p>${notice.description}</p>
                            ` : `
                                <p class="text-gray-500 italic">এই নোটিশের জন্য কোন বিস্তারিত বিবরণ নেই।</p>
                            `}
                        </div>
                        ${notice.fullContent ? `
                            <div class="notice-content mt-6 text-gray-700">
                                ${notice.fullContent}
                            </div>
                        ` : ''}
                    `;
                } else {
                    noticeContent.innerHTML = `
                        <div class="text-center py-8 text-red-500">
                            <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
                            <h2 class="text-2xl font-bold mb-2">নোটিশ পাওয়া যায়নি</h2>
                            <p>অনুগ্রহ করে সঠিক নোটিশ লিঙ্ক ব্যবহার করুন</p>
                        </div>
                    `;
                }
            }).catch(error => {
                console.error('Error loading notice:', error);
                noticeContent.innerHTML = `
                    <div class="text-center py-8 text-red-500">
                        <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
                        <h2 class="text-2xl font-bold mb-2">নোটিশ লোড করতে সমস্যা হয়েছে</h2>
                        <p>দয়া করে পরে আবার চেষ্টা করুন</p>
                    </div>
                `;
            });
        }

        // পেজ লোড হলে নোটিশ লোড করুন
        document.addEventListener('DOMContentLoaded', function() {
            loadNotice();
        });
    </script>
</body>
</html>
