<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result | ONNO ROKOM BIDDYANIKETON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Hind+Siliguri:wght@400;700&display=swap');
        
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Roboto', 'Hind Siliguri', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .marksheet-card {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm;
            margin: 20px auto;
            background: white;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            color: #000;
            border-radius: 8px;
            break-inside: avoid;
            page-break-after: always;
        }
        
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.03;
            width: 450px;
            pointer-events: none;
            z-index: 0;
        }
        
        .content-wrap {
            position: relative;
            z-index: 1;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        
        th, td {
            border: 1px solid #000;
            padding: 4px 2px;
            text-align: center;
            font-size: 11px;
        }
        
        .text-left {
            text-align: left;
            padding-left: 6px;
        }
        
        .grade-table td {
            font-size: 10px;
            padding: 2px;
        }
        
        .not-enrolled {
            background-color: #f9fafb;
            color: #9ca3af;
        }
        
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white;
                margin: 0;
                padding: 0;
            }
            .marksheet-card {
                margin: 0;
                box-shadow: none;
                border-radius: 0;
                width: 100%;
                page-break-after: avoid;
            }
            @page {
                size: portrait;
                margin: 10mm;
            }
        }
        
        .result-card {
            transition: all 0.3s ease;
        }
        
        .result-card:hover {
            transform: translateY(-5px);
        }
        
        .error-shake {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Admin Panel Styles - Photo Management */
        .admin-photo-panel {
            background: white;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .student-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #667eea;
        }
        .student-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
        }
        .photo-edit-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-edit-card {
            background: white;
            max-width: 500px;
            width: 90%;
            border-radius: 24px;
            overflow: hidden;
        }
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto no-print">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-lg">
                <h1 class="text-3xl font-bold text-white mb-2">
                    <i class="fas fa-graduation-cap"></i> Student Result Portal
                </h1>
                <p class="text-white/80">ONNO ROKOM BIDDYANIKETON</p>
            </div>
        </div>

        <!-- Admin Photo Management Panel (For Teachers/Admins) -->
        <div class="admin-photo-panel no-print" id="adminPanel" style="display: none;">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                    <i class="fas fa-camera text-green-600"></i>
                </div>
                <h3 class="font-bold text-gray-800">Student Photo Management</h3>
                <span class="text-xs text-gray-400 ml-auto">Admin Access Only</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50">
                        <tr><th class="p-2">Photo</th><th>Name</th><th>Class</th><th>Roll</th><th>Action</th></tr>
                    </thead>
                    <tbody id="adminStudentList"></tbody>
                </table>
            </div>
        </div>

        <!-- Search Card -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8 result-card">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center">
                    <i class="fas fa-search text-indigo-600"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-800">Find Your Result</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-calendar-alt text-indigo-500 mr-1"></i> Select Session
                    </label>
                    <select id="sessionSelect" class="w-full border-2 p-3 rounded-xl outline-none focus:border-indigo-500 transition-all bg-gray-50">
                        <option value="">-- Select Session --</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-file-alt text-indigo-500 mr-1"></i> Select Exam
                    </label>
                    <select id="examSelect" class="w-full border-2 p-3 rounded-xl outline-none focus:border-indigo-500 transition-all bg-gray-50" disabled>
                        <option value="">-- First Select Session --</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-chalkboard text-indigo-500 mr-1"></i> Select Class
                    </label>
                    <select id="classSelect" class="w-full border-2 p-3 rounded-xl outline-none focus:border-indigo-500 transition-all bg-gray-50" disabled>
                        <option value="">-- First Select Exam --</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-users text-indigo-500 mr-1"></i> Select Section
                    </label>
                    <select id="sectionSelect" class="w-full border-2 p-3 rounded-xl outline-none focus:border-indigo-500 transition-all bg-gray-50" disabled>
                        <option value="">-- First Select Class --</option>
                    </select>
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-id-card text-indigo-500 mr-1"></i> Enter Roll Number
                    </label>
                    <div class="flex gap-3">
                        <input type="text" id="rollInput" placeholder="Enter your Roll Number (e.g., 101)" 
                               class="flex-1 border-2 p-3 rounded-xl outline-none focus:border-indigo-500 bg-gray-50">
                        <button id="showResultBtn" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg">
                            <i class="fas fa-eye mr-2"></i> Show Result
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="mt-4 p-3 bg-blue-50 rounded-lg">
                <p class="text-xs text-blue-600">
                    <i class="fas fa-info-circle"></i> Instructions: Select Session, Exam, Class, Section and enter your Roll Number to view your marksheet.
                </p>
            </div>
        </div>

        <div id="resultContainer" class="mt-8"></div>
        
        <div id="printBtnContainer" class="text-center mt-6 no-print hidden">
            <button onclick="window.print()" class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-emerald-700 transition-all shadow-lg">
                <i class="fas fa-print mr-2"></i> Print Marksheet
            </button>
        </div>
    </div>

    <!-- Photo Edit Modal -->
    <div id="photoEditModal" class="photo-edit-modal hidden" style="display: none;">
        <div class="photo-edit-card">
            <div class="bg-indigo-50 px-6 py-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center gap-2"><i class="fas fa-user-edit text-indigo-600"></i> Update Student Photo</h3>
                <button onclick="closePhotoModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            <div class="p-6 text-center">
                <img id="modalStudentPhoto" src="" class="student-avatar-large mx-auto mb-4">
                <p class="font-bold" id="modalStudentName"></p>
                <p class="text-sm text-gray-500" id="modalStudentInfo"></p>
                <div class="flex gap-3 justify-center mt-5">
                    <button id="uploadPhotoBtn" class="bg-indigo-600 text-white px-5 py-2 rounded-lg"><i class="fas fa-upload"></i> Upload Photo</button>
                    <button id="removePhotoBtn" class="border border-red-400 text-red-600 px-5 py-2 rounded-lg"><i class="fas fa-trash"></i> Remove</button>
                </div>
                <div class="mt-4 flex justify-end gap-2 border-t pt-4">
                    <button onclick="closePhotoModal()" class="px-4 py-2 border rounded-lg">Cancel</button>
                    <button id="savePhotoBtn" class="px-5 py-2 bg-green-600 text-white rounded-lg">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import {
            getFirestore, doc, getDoc, collection, getDocs, query, where, orderBy, updateDoc
        } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCA6d95VTLNo_FAEzJCoOzuEhHCl5LeSqk",
            authDomain: "school-menejment.firebaseapp.com",
            projectId: "school-menejment",
            storageBucket: "school-menejment.firebasestorage.app",
            messagingSenderId: "348342436525",
            appId: "1:348342436525:web:c339fe6216c4516aa3bc24"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const CLOUDINARY_CLOUD_NAME = "dhvtgzy5x";
        const CLOUDINARY_UPLOAD_PRESET = "Rosenews";

        let currentSession = "2025-2026";
        let allExamsCache = [];
        let allClassesCache = [];
        let allSubjectsCache = [];
        let allSectionsCache = [];
        let allSetupCache = [];
        let allMarksCache = [];
        let allStudentsCache = []; 
        
        let currentSchoolName = "ONNO ROKOM BIDDYANIKETON";
        let currentSchoolAddress = "PORANPUR, KAZIPUR, SIRAJGANJ";
        let availableSessions = [];
        
        let currentEditingStudent = null;
        let tempPhotoUrl = "";
        let cloudinaryWidget = null;

        function showToastMessage(msg, type = "success") {
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.style.background = type === 'error' ? '#dc2626' : '#10b981';
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle'} mr-2"></i>${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function initCloudinaryWidget() {
            if (!window.cloudinary) return;
            cloudinaryWidget = window.cloudinary.createUploadWidget({
                cloudName: CLOUDINARY_CLOUD_NAME,
                uploadPreset: CLOUDINARY_UPLOAD_PRESET,
                sources: ['local', 'camera'],
                multiple: false,
                maxFileSize: 2000000,
                clientAllowedFormats: ['jpg', 'jpeg', 'png']
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    tempPhotoUrl = result.info.secure_url;
                    document.getElementById('modalStudentPhoto').src = tempPhotoUrl;
                    showToastMessage("Photo uploaded! Click Save to update.", "success");
                } else if (error) {
                    showToastMessage("Upload failed: " + (error.message || "Max 2MB"), "error");
                }
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
        }

        function safeNum(v) {
            const n = parseFloat(v);
            return Number.isFinite(n) ? n : 0;
        }

        function calculateGrade(obt, full) {
            if (!full || full <= 0) return { lg: "-", gp: 0 };
            const p = (obt / full) * 100;
            if (p >= 80) return { lg: "A+", gp: 5.00 };
            if (p >= 70) return { lg: "A", gp: 4.00 };
            if (p >= 60) return { lg: "A-", gp: 3.50 };
            if (p >= 50) return { lg: "B", gp: 3.00 };
            if (p >= 40) return { lg: "C", gp: 2.00 };
            if (p >= 33) return { lg: "D", gp: 1.00 };
            return { lg: "F", gp: 0.00 };
        }

        async function loadSessions() {
            try {
                const sdoc = await getDoc(doc(db, "config", "activeSession"));
                if (sdoc.exists()) currentSession = sdoc.data().sessionName || currentSession;
                const startYear = 2020, endYear = 2030;
                availableSessions = [];
                for (let year = startYear; year < endYear; year++) availableSessions.push(`${year}-${year + 1}`);
                renderSessionDropdown();
                const defaultSession = getSelectedSession();
                if (defaultSession) await loadExams();
            } catch (e) { console.error(e); }
        }
        
        function renderSessionDropdown() {
            const sessionSelect = document.getElementById('sessionSelect');
            sessionSelect.innerHTML = '<option value="">-- Select Session --</option>';
            availableSessions.forEach(session => {
                sessionSelect.innerHTML += `<option value="${session}" ${session === currentSession ? 'selected' : ''}>${session} ${session === currentSession ? '(Active)' : ''}</option>`;
            });
        }
        
        function getSelectedSession() { return document.getElementById('sessionSelect').value; }

        async function loadAllData() {
            const exSnap = await getDocs(query(collection(db, "exams"), where("status", "==", "published")));
            allExamsCache = exSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const [clSnap, subSnap, secSnap, setupSnap, marksSnap] = await Promise.all([
                getDocs(query(collection(db, "classes"), orderBy("order"))),
                getDocs(collection(db, "subjects")),
                getDocs(collection(db, "sections")),
                getDocs(collection(db, "mark_setup")),
                getDocs(collection(db, "marks"))
            ]);
            
            allClassesCache = clSnap.docs.map(d => ({ id: d.id, name: d.data().name }));
            allSubjectsCache = subSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            allSectionsCache = secSnap.docs.map(d => ({ name: d.data().name, classId: d.data().classId }));
            allSetupCache = setupSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            allMarksCache = marksSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            await loadAllStudentsForAdmin();
        }
        
        async function loadAllStudentsForAdmin() {
            allStudentsCache = [];
            const classesSnap = await getDocs(collection(db, "classes"));
            for (const classDoc of classesSnap.docs) {
                const classId = classDoc.id;
                const sessionVal = getSelectedSession() || currentSession;
                const studRef = collection(db, `current_session/${sessionVal}/classes/${classId}/students`);
                const studSnap = await getDocs(studRef);
                for (const docSnap of studSnap.docs) {
                    const data = docSnap.data();
                    allStudentsCache.push({
                        id: docSnap.id,
                        fullName: data.fullName || data.name || "-",
                        className: allClassesCache.find(c => c.id === classId)?.name || "",
                        section: data.section || "",
                        rollNumber: data.rollNumber || data.roll || "",
                        classId: classId,
                        profileImage: data.profileImage || "",
                        _sessionPath: `current_session/${sessionVal}/classes/${classId}/students`
                    });
                }
            }
            renderAdminPanel();
        }

        function renderAdminPanel() {
            const tbody = document.getElementById('adminStudentList');
            if (!tbody) return;
            tbody.innerHTML = allStudentsCache.map(s => `
                <tr class="border-b">
                    <td class="p-2"><img src="${s.profileImage || `https://ui-avatars.com/api/?background=667eea&color=fff&name=${encodeURIComponent(s.fullName)}`}" class="student-avatar" onerror="this.src='https://ui-avatars.com/api/?background=667eea&color=fff&name=${encodeURIComponent(s.fullName)}'"></td>
                    <td class="p-2 font-medium">${escapeHtml(s.fullName)}</td>
                    <td class="p-2">${escapeHtml(s.className)} (${escapeHtml(s.section)})</td>
                    <td class="p-2">${escapeHtml(s.rollNumber)}</td>
                    <td class="p-2"><button onclick='openPhotoEditor("${s.id}")' class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg text-xs"><i class="fas fa-camera"></i> Edit Photo</button></td>
                </tr>
            `).join('');
        }

        window.openPhotoEditor = async (studentId) => {
            const student = allStudentsCache.find(s => s.id === studentId);
            if (!student) return;
            currentEditingStudent = student;
            tempPhotoUrl = student.profileImage || "";
            document.getElementById('modalStudentPhoto').src = student.profileImage || `https://ui-avatars.com/api/?background=667eea&color=fff&name=${encodeURIComponent(student.fullName)}`;
            document.getElementById('modalStudentName').innerText = student.fullName;
            document.getElementById('modalStudentInfo').innerText = `${student.className} - ${student.section} | Roll: ${student.rollNumber}`;
            document.getElementById('photoEditModal').style.display = 'flex';
            document.getElementById('photoEditModal').classList.remove('hidden');
        };

        window.closePhotoModal = () => {
            document.getElementById('photoEditModal').classList.add('hidden');
            document.getElementById('photoEditModal').style.display = 'none';
            currentEditingStudent = null;
            tempPhotoUrl = "";
        };

        async function saveStudentPhoto() {
            if (!currentEditingStudent) return;
            try {
                const studentRef = doc(db, currentEditingStudent._sessionPath, currentEditingStudent.id);
                await updateDoc(studentRef, { profileImage: tempPhotoUrl });
                const idx = allStudentsCache.findIndex(s => s.id === currentEditingStudent.id);
                if (idx !== -1) allStudentsCache[idx].profileImage = tempPhotoUrl;
                renderAdminPanel();
                showToastMessage("Student photo updated successfully!", "success");
                closePhotoModal();
            } catch (err) {
                showToastMessage("Update failed: " + err.message, "error");
            }
        }

        async function removeStudentPhoto() {
            if (!currentEditingStudent) return;
            tempPhotoUrl = "";
            document.getElementById('modalStudentPhoto').src = `https://ui-avatars.com/api/?background=667eea&color=fff&name=${encodeURIComponent(currentEditingStudent.fullName)}`;
            showToastMessage("Photo removed. Click Save to confirm.", "warning");
        }

        async function loadExams() {
            const sessionVal = getSelectedSession();
            if (!sessionVal) return;
            const filteredExams = allExamsCache.filter(exam => exam.session === sessionVal);
            const examSelect = document.getElementById('examSelect');
            examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
            filteredExams.forEach(exam => examSelect.innerHTML += `<option value="${exam.id}">${escapeHtml(exam.name)}</option>`);
            examSelect.disabled = false;
        }

        function loadClasses() {
            const classSelect = document.getElementById('classSelect');
            classSelect.innerHTML = '<option value="">-- Select Class --</option>';
            allClassesCache.forEach(cls => classSelect.innerHTML += `<option value="${cls.id}">${escapeHtml(cls.name)}</option>`);
            classSelect.disabled = false;
        }

        function loadSections(classId) {
            const filteredSections = allSectionsCache.filter(sec => sec.classId === classId);
            const secSelect = document.getElementById('sectionSelect');
            secSelect.innerHTML = '<option value="">-- Select Section --</option>';
            filteredSections.forEach(sec => secSelect.innerHTML += `<option value="${sec.name}">${escapeHtml(sec.name)}</option>`);
            secSelect.disabled = false;
        }

        async function getStudentData(sessionVal, classId, sectionName, rollNumber) {
            const studRef = collection(db, `current_session/${sessionVal}/classes/${classId}/students`);
            const studSnap = await getDocs(studRef);
            for (const docSnap of studSnap.docs) {
                const data = docSnap.data();
                const studentRoll = data.rollNumber || data.roll || '';
                const studentSection = data.section || '';
                if (String(studentRoll) === String(rollNumber) && studentSection === sectionName) {
                    return {
                        id: docSnap.id,
                        ...data,
                        classId: classId,
                        className: allClassesCache.find(c => c.id === classId)?.name || '',
                        section: studentSection,
                        rollNumber: studentRoll,
                        fullName: data.fullName || '',
                        admissionNo: data.admissionNumber || data.admissionNo || '',
                        profileImage: data.profileImage || ''
                    };
                }
            }
            return null;
        }

        // Event Listeners
        document.getElementById('sessionSelect').addEventListener('change', async () => {
            if (getSelectedSession()) { await loadExams(); await loadAllStudentsForAdmin(); }
            document.getElementById('examSelect').disabled = false;
            document.getElementById('resultContainer').innerHTML = '';
            document.getElementById('printBtnContainer').classList.add('hidden');
        });
        document.getElementById('examSelect').addEventListener('change', () => { if (document.getElementById('examSelect').value) loadClasses(); });
        document.getElementById('classSelect').addEventListener('change', (e) => { if (e.target.value) loadSections(e.target.value); });

        document.getElementById('showResultBtn').onclick = async () => {
            const sessionVal = getSelectedSession();
            const examId = document.getElementById('examSelect').value;
            const classId = document.getElementById('classSelect').value;
            const sectionName = document.getElementById('sectionSelect').value;
            const rollNumber = document.getElementById('rollInput').value.trim();

            if (!sessionVal || !examId || !classId || !sectionName || !rollNumber) {
                alert("Please fill all fields");
                return;
            }

            const container = document.getElementById('resultContainer');
            container.innerHTML = `<div class='text-center p-12 bg-white rounded-2xl shadow-lg'><i class='fas fa-spinner fa-spin text-4xl text-indigo-600 mb-4'></i><p>Loading...</p></div>`;

            try {
                const examName = allExamsCache.find(e => e.id === examId)?.name || examId;
                const student = await getStudentData(sessionVal, classId, sectionName, rollNumber);
                if (!student) {
                    container.innerHTML = `<div class='text-center p-12 bg-white rounded-2xl shadow-lg'><i class='fas fa-user-graduate text-6xl text-red-400 mb-4'></i><h3 class='font-bold text-xl text-red-600'>Student Not Found!</h3></div>`;
                    document.getElementById('printBtnContainer').classList.add('hidden');
                    return;
                }

                const studentPhoto = student.profileImage || `https://ui-avatars.com/api/?background=667eea&color=fff&name=${encodeURIComponent(student.fullName)}`;
                const subjects = allSubjectsCache.filter(sub => sub.classId === classId);
                const marksData = allMarksCache.filter(m => m.studentId === student.id && m.examId === examId);
                
                // 🔥 ফোর্থ সাবজেক্ট ও বোনাস জিপিএ ক্যালকুলেশন ভ্যারিয়েবল
                let totalObtained = 0, totalFullMarks = 0, totalGP = 0, isFailed = false, rows = "";
                let mandatorySubCount = 0, fourthSubGP = 0, fourthSubBonus = 0;

                subjects.forEach((sub, index) => {
                    const subType = sub.type || 'mandatory';
                    const studentAdditional = student.additionalSubjects || [];
                    const isStudentFourthSub = subType === 'optional' && studentAdditional.includes(sub.name);
                    
                    // যে অপশনাল সাবজেক্ট সে পরেনি, সেটি ধূসর করে দেখাবে কিন্তু মার্কশীটে থাকবে
                    if (subType === 'optional' && !isStudentFourthSub) {
                        rows += `<tr class="not-enrolled">
                            <td>${String(index+1).padStart(2,'0')}</td>
                            <td class="text-left font-bold uppercase">${escapeHtml(sub.name)} <span class="text-[8px] font-normal italic">(Not Enrolled)</span></td>
                            <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                            <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                        </tr>`;
                        return; 
                    }

                    const marksObj = marksData.find(m => m.subjectId === sub.id);
                    const m = marksObj?.marks || {};
                    const setupKey = `${examId}_${classId}_${student.section || ''}_${sub.id}_${sessionVal}`;
                    const setupData = allSetupCache.find(s => s.id === setupKey);
                    const setup = setupData?.marks || {};

                    const wF = setup.written?.enabled ? safeNum(setup.written.full) : 0;
                    const mF = setup.mcq?.enabled ? safeNum(setup.mcq.full) : 0;
                    const pF = setup.practical?.enabled ? safeNum(setup.practical.full) : 0;
                    const wO = safeNum(m.written), mO = safeNum(m.mcq), pO = safeNum(m.practical);
                    const rowTotal = wO + mO + pO, rowFull = wF + mF + pF;
                    const grade = calculateGrade(rowTotal, rowFull);
                    
                    totalObtained += rowTotal; 
                    totalFullMarks += rowFull;
                    
                    // ফোর্থ সাবজেক্ট হলে আলাদা ভাবে গ্রেড ক্যালকুলেট ও ফেইল চেক
                    if (isStudentFourthSub) {
                        fourthSubGP = grade.gp;
                        if (grade.lg === "F") isFailed = true;
                    } else {
                        totalGP += grade.gp;
                        mandatorySubCount++;
                        if (grade.lg === "F") isFailed = true;
                    }

                    let displaySubName = escapeHtml(sub.name);
                    if (isStudentFourthSub) displaySubName += ` <span class="text-[8px] text-indigo-700 font-normal">(4th Sub)</span>`;

                    rows += `<tr>
                        <td>${String(index+1).padStart(2,'0')}</td>
                        <td class="text-left font-bold uppercase">${displaySubName}</td>
                        <td>${wF||'-'}</td><td>${wF?wO:'-'}</td><td>${mF||'-'}</td><td>${mF?mO:'-'}</td>
                        <td>${pF||'-'}</td><td>${pF?pO:'-'}</td><td class="font-bold">${rowFull||'-'}</td>
                        <td class="font-bold">${rowTotal}</td><td class="font-black">${grade.lg}</td>
                        <td>${grade.gp.toFixed(2)}</td><td>-</td><td>-</td>
                    </tr>`;
                });

                // শিক্ষাবোর্ড নিয়ম: 4th Subject এ 2.00 এর বেশি হলে বোনাস পয়েন্ট যোগ হবে
                fourthSubBonus = Math.max(0, fourthSubGP - 2.00);
                const finalGPA = isFailed ? 0.00 : ((totalGP + fourthSubBonus) / (mandatorySubCount || 1));
                const finalGrade = isFailed ? "F" : calculateGrade(totalObtained, totalFullMarks).lg;

                const marksheetHTML = `
                <div class="marksheet-card">
                    <div class="content-wrap">
                        <div class="flex justify-between items-center border-b-2 border-black pb-2">
                            <div class="w-20 h-20 bg-gray-200 flex items-center justify-center text-gray-400 text-xs">LOGO</div>
                            <div class="text-center">
                                <h1 class="text-2xl font-black text-indigo-900 uppercase">${escapeHtml(currentSchoolName)}</h1>
                                <p class="text-[10px] font-bold mt-1 uppercase">${escapeHtml(currentSchoolAddress)}</p>
                                <div class="mt-2 bg-black text-white px-4 py-1 text-[12px] font-bold rounded-full">Academic Transcript: ${escapeHtml(examName)}</div>
                            </div>
                            <div class="w-24 h-28 border-2 border-black flex items-center justify-center overflow-hidden">
                                <img src="${escapeHtml(studentPhoto)}" class="w-full h-full object-cover" onerror="this.src='https://ui-avatars.com/api/?background=667eea&color=fff&name=${encodeURIComponent(student.fullName)}'">
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mt-4 text-[11px] font-bold uppercase">
                            <div class="border-b pb-1">STUDENT NAME: <span class="font-normal">${escapeHtml(student.fullName)}</span></div>
                            <div class="border-b pb-1">CLASS: <span class="font-normal">${escapeHtml(student.className)}</span></div>
                            <div class="border-b pb-1">ROLL NO: <span class="font-normal">${escapeHtml(student.rollNumber)}</span></div>
                            <div class="border-b pb-1">SECTION: <span class="font-normal">${escapeHtml(student.section)}</span></div>
                            <div class="border-b pb-1">STUDENT ID: <span class="font-normal">${escapeHtml(student.admissionNo)}</span></div>
                            <div class="border-b pb-1">SESSION: <span class="font-normal">${escapeHtml(sessionVal)}</span></div>
                        </div>
                        <table class="mt-4"><thead class="bg-gray-100"><tr><th rowspan="2">SL</th><th rowspan="2">SUBJECT</th><th colspan="2">WRITTEN</th><th colspan="2">MCQ</th><th colspan="2">PRAC.</th><th colspan="2">TOTAL</th><th rowspan="2">LG</th><th rowspan="2">GP</th><th rowspan="2">HI</th><th rowspan="2">POS</th></tr><tr class="text-[9px]"><th>Full</th><th>Obt</th><th>Full</th><th>Obt</th><th>Full</th><th>Obt</th><th>Full</th><th>Obt</th></tr></thead>
                        <tbody>${rows}</tbody>
                        <tfoot class="bg-gray-50 font-bold">
                            <tr>
                                <td colspan="2" class="text-left py-2 px-2">Total: ${totalObtained} / ${totalFullMarks}</td>
                                <td colspan="4">GPA: ${finalGPA.toFixed(2)} ${fourthSubBonus > 0 ? `<span class="text-[8px] text-green-700">(+${fourthSubBonus.toFixed(2)} Bonus)</span>` : ''}</td>
                                <td colspan="4">LETTER GRADE: ${finalGrade}</td>
                                <td colspan="4">RESULT: <span class="${isFailed ? 'text-red-600' : 'text-emerald-700'}">${isFailed ? 'FAILED' : 'PASSED'}</span></td>
                            </tr>
                        </tfoot>
                        </table>
                        <div class="grid grid-cols-2 gap-4 mt-4"><div><table class="grade-table w-full"><tr class="bg-gray-100"><th>Personal Traits</th><th>Rating</th></tr><tr><td class="text-left">Attendance</td><td>_______</td></tr><tr><td class="text-left">Behavior</td><td>_______</td></tr></table></div><div><table class="grade-table w-full"><tr class="bg-gray-100"><th>Range</th><th>Grade</th><th>GPA</th></tr><tr><td>80-100</td><td>A+</td><td>5.00</td></tr><tr><td>70-79</td><td>A</td><td>4.00</td></tr><tr><td>60-69</td><td>A-</td><td>3.50</td></tr><tr><td>33-39</td><td>D</td><td>1.00</td></tr></table></div></div>
                        <div class="mt-6 border border-black p-2 text-[10px]"><div class="flex border-b pb-1"><span class="font-bold w-40">CLASS TEACHER'S REMARK:</span><span class="flex-1"></span></div><div class="flex pt-1"><span class="font-bold w-40">PRINCIPAL'S REMARK:</span><span class="flex-1"></span></div></div>
                        <div class="mt-12 flex justify-between"><div class="text-center border-t pt-1 w-40 text-[10px]">Class Teacher</div><div class="text-center border-t pt-1 w-40 text-[10px]">Guardian</div><div class="text-center border-t pt-1 w-40 text-[10px]">Principal</div></div>
                    </div>
                </div>`;
                container.innerHTML = marksheetHTML;
                document.getElementById('printBtnContainer').classList.remove('hidden');
            } catch (error) {
                container.innerHTML = `<div class='text-center p-12 bg-white rounded-2xl shadow-lg'><i class='fas fa-exclamation-triangle text-6xl text-red-400'></i><p class='mt-2'>Error: ${error.message}</p></div>`;
            }
        };

        async function loadSchoolInfo() {
            const schoolDoc = await getDoc(doc(db, "settings", "school_info"));
            if (schoolDoc.exists()) {
                currentSchoolName = schoolDoc.data().school_name || currentSchoolName;
                currentSchoolAddress = schoolDoc.data().contact_address || currentSchoolAddress;
            }
        }

        onAuthStateChanged(auth, async (user) => {
            await loadSessions();
            await loadAllData();
            await loadSchoolInfo();
            initCloudinaryWidget();
            
            if (user && (user.email === "admin@school.com" || user.email === "teacher@school.com")) {
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                document.getElementById('adminPanel').style.display = 'none';
            }
        });

        document.getElementById('uploadPhotoBtn')?.addEventListener('click', () => cloudinaryWidget?.open());
        document.getElementById('removePhotoBtn')?.addEventListener('click', removeStudentPhoto);
        document.getElementById('savePhotoBtn')?.addEventListener('click', saveStudentPhoto);
    </script>
</body>
</html>
