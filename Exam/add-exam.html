<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Control - Session Wise | ONNO ROKOM BIDDYANIKETON</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }

        .session-info {
            background: linear-gradient(135deg, var(--accent), #2980b9);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .session-badge {
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .session-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .session-selector select {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
        }

        .input-group input, .input-group select {
            flex: 1;
            min-width: 180px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.2s;
        }

        .btn-add { background: var(--accent); }
        .btn-update { background: #8e44ad; display: none; }
        .btn-cancel { background: #95a5a6; display: none; }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .status-draft { background: #eee; color: #666; border: 1px solid #ccc; }
        .status-published { background: var(--success); color: #fff; }

        .btn-action { font-size: 12px; padding: 6px 10px; margin-right: 2px; margin-bottom: 2px; }
        .btn-edit { background: #2980b9; }
        .btn-publish { background: var(--success); }
        .btn-draft { background: var(--warning); }
        .btn-delete { background: var(--danger); }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: var(--primary); color: white; }
        .session-tag { font-size: 10px; background: #e0e0e0; padding: 2px 6px; border-radius: 10px; margin-left: 5px; }
        .loading { text-align: center; padding: 40px; color: #666; }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            th, td { padding: 8px 10px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fas fa-edit"></i> Exam Management Control</h2>

    <!-- Session Info Bar -->
    <div class="session-info">
        <div>
            <i class="fas fa-calendar-alt"></i> <strong>Current Academic Session</strong>
        </div>
        <div class="session-selector">
            <span class="session-badge" id="currentSessionLabel">Loading...</span>
            <select id="sessionSelect">
                <option value="current">Current Session</option>
                <option value="next">Next Session</option>
            </select>
        </div>
    </div>

    <!-- Input Section -->
    <div class="input-group">
        <input type="hidden" id="editDocId">
        <input type="text" id="examName" placeholder="পরীক্ষার নাম (যেমন: Half Yearly, Final Exam)...">
        <input type="number" id="orderNumber" placeholder="সিরিয়াল (১, ২, ৩...)">
        <select id="examStatus">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
        </select>
        
        <button id="addBtn" class="btn btn-add" onclick="addExam()">
            <i class="fas fa-plus"></i> Add Exam
        </button>
        
        <button id="updateBtn" class="btn btn-update" onclick="submitUpdate()">
            <i class="fas fa-save"></i> Update Changes
        </button>
        
        <button id="cancelBtn" class="btn btn-cancel" onclick="resetForm()">
            <i class="fas fa-times"></i> Cancel
        </button>
    </div>

    <div class="table-responsive">
        <table id="examTable">
            <thead>
                <tr>
                    <th>Order</th>
                    <th>Exam Name</th>
                    <th>Session</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="examTableBody">
                <tr><td colspan="5" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading exams...</td></tr>
            </tbody>
        </table>
    </div>
    
    <div style="margin-top: 15px; padding: 10px; background: #e8f4f8; border-radius: 8px; font-size: 12px;">
        <i class="fas fa-info-circle"></i> <strong>Note:</strong> প্রতিটি Exam নির্দিষ্ট Session এর অধীনে সংরক্ষিত হয়। 
        Session পরিবর্তন করলে সেই Session এর Exams দেখাবে।
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, getDocs, query, where, 
        orderBy, onSnapshot, doc, updateDoc, deleteDoc, getDoc 
    } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCA6d95VTLNo_FAEzJCoOzuEhHCl5LeSqk",
        authDomain: "school-menejment.firebaseapp.com",
        projectId: "school-menejment",
        storageBucket: "school-menejment.firebasestorage.app",
        messagingSenderId: "348342436525",
        appId: "1:348342436525:web:c339fe6216c4516aa3bc24"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentSession = "2025-2026";
    let nextSession = "2026-2027";
    let currentViewSession = "current"; // 'current' or 'next'
    let allExamsCache = []; // Cache all exams

    // Load active session from config
    async function loadActiveSession() {
        try {
            const sdoc = await getDoc(doc(db, "config", "activeSession"));
            if (sdoc.exists()) {
                currentSession = sdoc.data().sessionName || currentSession;
            }
            const parts = currentSession.split('-');
            nextSession = parts.length === 2 ? `${parseInt(parts[0]) + 1}-${parseInt(parts[1]) + 1}` : "2026-2027";
        } catch (e) {
            console.error("Error loading session:", e);
        }
        
        document.getElementById('currentSessionLabel').innerHTML = `<i class="fas fa-database"></i> ${currentSession}`;
    }

    // Get current viewing session string
    function getViewingSession() {
        return currentViewSession === 'current' ? currentSession : nextSession;
    }

    // Load and display exams (without complex query)
    async function loadExams() {
        const viewingSession = getViewingSession();
        const tableBody = document.getElementById('examTableBody');
        
        tableBody.innerHTML = '<tr><td colspan="5" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading exams...</td></tr>';
        
        try {
            // Get all exams first
            const querySnapshot = await getDocs(collection(db, "exams"));
            const allExams = [];
            
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                allExams.push({
                    id: docSnap.id,
                    ...data
                });
            });
            
            // Filter by session and sort by order
            const filteredExams = allExams
                .filter(exam => exam.session === viewingSession)
                .sort((a, b) => (a.order || 0) - (b.order || 0));
            
            if (filteredExams.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px;">
                    <i class="fas fa-calendar-times" style="font-size: 40px; color: #ccc;"></i><br>
                    <strong>${viewingSession} সেশনে কোন পরীক্ষা নেই</strong><br>
                    <small>উপরে ফর্ম পূরণ করে নতুন পরীক্ষা যোগ করুন</small>
                </td></tr>`;
                return;
            }
            
            tableBody.innerHTML = "";
            
            filteredExams.forEach((data) => {
                const id = data.id;
                const currentStatus = data.status || "draft";
                const statusClass = currentStatus === 'published' ? 'status-published' : 'status-draft';
                
                tableBody.innerHTML += `
                    <tr>
                        <td><strong>${data.order || '-'}</strong></td>
                        <td><strong>${escapeHtml(data.name)}</strong>${data.session ? `<span class="session-tag">${data.session}</span>` : ''}</td>
                        <td><span class="session-badge" style="background:#e0e7ff; color:#1e40af; font-size:11px;">${data.session || viewingSession}</span></td>
                        <td><span class="status-badge ${statusClass}">${currentStatus === 'published' ? 'Published' : 'Draft'}</span></td>
                        <td>
                            <button class="btn btn-action btn-edit" onclick="window.editExam('${id}', '${escapeHtml(data.name)}', ${data.order || 0}, '${currentStatus}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            ${currentStatus === 'draft' ? 
                                `<button class="btn btn-action btn-publish" onclick="window.toggleStatus('${id}', 'published')"><i class="fas fa-check"></i> Publish</button>` : 
                                `<button class="btn btn-action btn-draft" onclick="window.toggleStatus('${id}', 'draft')"><i class="fas fa-undo"></i> Draft</button>`
                            }
                            <button class="btn btn-action btn-delete" onclick="window.deleteExam('${id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            
        } catch (error) {
            console.error("Error loading exams:", error);
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: red; padding: 40px;">
                <i class="fas fa-exclamation-triangle" style="font-size: 40px;"></i><br>
                Error loading exams: ${error.message}<br>
                <small>Please check your connection and try again.</small>
            </td></tr>`;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    // Add new exam
    window.addExam = async function() {
        const name = document.getElementById('examName').value.trim();
        const order = document.getElementById('orderNumber').value;
        const status = document.getElementById('examStatus').value;
        
        if (!name || !order) {
            alert("দয়া করে পরীক্ষার নাম এবং সিরিয়াল নম্বর দিন");
            return;
        }
        
        const viewingSession = getViewingSession();
        
        try {
            await addDoc(collection(db, "exams"), {
                name: name,
                order: parseInt(order),
                status: status,
                session: viewingSession,
                createdAt: new Date().toISOString()
            });
            
            resetForm();
            alert(`✅ "${name}" পরীক্ষা ${viewingSession} সেশনে যোগ করা হয়েছে`);
            await loadExams(); // Reload after add
        } catch (error) {
            console.error("Error adding exam:", error);
            alert("Exam যোগ করতে সমস্যা হয়েছে: " + error.message);
        }
    };

    // Edit exam
    window.editExam = function(id, name, order, status) {
        document.getElementById('editDocId').value = id;
        document.getElementById('examName').value = name;
        document.getElementById('orderNumber').value = order;
        document.getElementById('examStatus').value = status;

        document.getElementById('addBtn').style.display = 'none';
        document.getElementById('updateBtn').style.display = 'inline-block';
        document.getElementById('cancelBtn').style.display = 'inline-block';
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Submit update
    window.submitUpdate = async function() {
        const id = document.getElementById('editDocId').value;
        const name = document.getElementById('examName').value.trim();
        const order = document.getElementById('orderNumber').value;
        const status = document.getElementById('examStatus').value;

        if (!id || !name || !order) {
            alert("সব তথ্য পূরণ করুন");
            return;
        }

        try {
            await updateDoc(doc(db, "exams", id), {
                name: name,
                order: parseInt(order),
                status: status,
                updatedAt: new Date().toISOString()
            });
            
            alert("✅ Exam তথ্য আপডেট হয়েছে!");
            resetForm();
            await loadExams(); // Reload after update
        } catch (error) {
            console.error("Error updating exam:", error);
            alert("আপডেট করতে সমস্যা হয়েছে: " + error.message);
        }
    };

    // Toggle status
    window.toggleStatus = async function(id, newStatus) {
        try {
            await updateDoc(doc(db, "exams", id), { 
                status: newStatus,
                updatedAt: new Date().toISOString()
            });
            console.log(`Status changed to ${newStatus}`);
            await loadExams(); // Reload after status change
        } catch (error) {
            console.error("Error toggling status:", error);
            alert("স্ট্যাটাস পরিবর্তন করতে সমস্যা হয়েছে");
        }
    };

    // Delete exam
    window.deleteExam = async function(id) {
        if(confirm("আপনি কি এই পরীক্ষাটি সম্পূর্ণ মুছে ফেলতে চান?")) {
            try {
                await deleteDoc(doc(db, "exams", id));
                alert("✅ পরীক্ষা মুছে ফেলা হয়েছে");
                await loadExams(); // Reload after delete
            } catch (error) {
                console.error("Error deleting exam:", error);
                alert("মুছে ফেলতে সমস্যা হয়েছে: " + error.message);
            }
        }
    };

    // Reset form
    window.resetForm = function() {
        document.getElementById('editDocId').value = "";
        document.getElementById('examName').value = "";
        document.getElementById('orderNumber').value = "";
        document.getElementById('examStatus').value = "draft";
        
        document.getElementById('addBtn').style.display = 'inline-block';
        document.getElementById('updateBtn').style.display = 'none';
        document.getElementById('cancelBtn').style.display = 'none';
    };

    // Session change handler
    document.getElementById('sessionSelect').addEventListener('change', async (e) => {
        currentViewSession = e.target.value;
        const viewingSession = getViewingSession();
        document.getElementById('currentSessionLabel').innerHTML = `<i class="fas fa-eye"></i> ${viewingSession}`;
        resetForm();
        await loadExams(); // Reload exams for new session
    });

    // Initialize
    async function init() {
        await loadActiveSession();
        await loadExams();
    }
    
    init();
</script>

</body>
</html>
