<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Attendance | Mark Student Attendance - Session Wise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        indigo: '#6366f1'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #f1f5f9; font-family: 'Inter', sans-serif; }
        .status-btn { transition: all 0.15s; cursor: pointer; }
        .status-btn.active { transform: scale(1.02); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .student-row:hover { background-color: #fefce8; }
        .date-picker::-webkit-calendar-picker-indicator { cursor: pointer; }
        .session-badge { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

    <div id="toast" class="fixed top-20 right-4 left-4 md:left-auto z-50 hidden transition-all duration-300 max-w-sm shadow-2xl">
        <div class="bg-white rounded-xl shadow-xl px-4 py-3 flex items-center gap-3 border-l-4 border-success">
            <i id="toast-icon" class="fas fa-check-circle text-success text-lg"></i>
            <p id="toast-text" class="text-gray-700 text-sm font-medium flex-1">Success</p>
            <button onclick="hideToast()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-wrap justify-between items-center mb-6 gap-3">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="bg-white p-2 rounded-full shadow-sm hover:bg-gray-50 transition">
                    <i class="fas fa-arrow-left text-primary"></i>
                </a>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800 flex items-center gap-2">
                    <span class="bg-primary text-white p-1.5 rounded-xl"><i class="fas fa-calendar-check"></i></span>
                    Mark Attendance
                </h1>
            </div>
            <div class="bg-white px-4 py-2 rounded-full shadow-sm text-sm font-medium text-gray-700">
                <i class="fas fa-chalkboard-user text-primary mr-1"></i> 
                <span id="session_badge">Session: 2025-2026</span>
            </div>
        </div>

        <!-- Filters Card -->
        <div class="bg-white rounded-2xl shadow-md p-5 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Session</label>
                    <select id="sessionSelect" class="w-full border border-gray-300 rounded-xl p-2.5 focus:ring-2 focus:ring-primary/30">
                        <option value="current">Current Session</option>
                        <option value="next">Next Session</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Class</label>
                    <select id="classSelect" class="w-full border border-gray-300 rounded-xl p-2.5 focus:ring-2 focus:ring-primary/30">
                        <option value="">-- Select Class --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Section</label>
                    <select id="sectionSelect" class="w-full border border-gray-300 rounded-xl p-2.5" disabled>
                        <option value="">First select class</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Date</label>
                    <input type="date" id="attendanceDate" class="w-full border border-gray-300 rounded-xl p-2.5 date-picker">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Filter</label>
                    <select id="statusFilter" class="w-full border border-gray-300 rounded-xl p-2.5">
                        <option value="all">All Students</option>
                        <option value="present">Present Only</option>
                        <option value="absent">Absent Only</option>
                        <option value="late">Late Only</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button id="loadStudentsBtn" class="flex-1 bg-primary text-white py-2.5 rounded-xl hover:bg-blue-700 transition font-medium">
                        <i class="fas fa-users mr-1"></i> Load
                    </button>
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="summaryCards">
            <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-primary">
                <p class="text-gray-500 text-xs uppercase">Total Students</p>
                <p id="totalStudentsCount" class="text-2xl font-bold text-slate-800">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-success">
                <p class="text-gray-500 text-xs uppercase">Present</p>
                <p id="presentCount" class="text-2xl font-bold text-success">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-danger">
                <p class="text-gray-500 text-xs uppercase">Absent</p>
                <p id="absentCount" class="text-2xl font-bold text-danger">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-warning">
                <p class="text-gray-500 text-xs uppercase">Late</p>
                <p id="lateCount" class="text-2xl font-bold text-warning">0</p>
            </div>
        </div>

        <!-- Attendance Table -->
        <div class="bg-white rounded-2xl shadow-md overflow-hidden">
            <div class="bg-gradient-to-r from-primary/5 to-indigo-50 px-5 py-4 border-b flex justify-between items-center flex-wrap gap-2">
                <div>
                    <h2 class="font-bold text-gray-800"><i class="fas fa-list-check text-primary mr-2"></i>Student Attendance</h2>
                    <p class="text-xs text-gray-500 mt-0.5">Click on status badges to change attendance</p>
                </div>
                <div class="flex gap-2">
                    <button id="markAllPresent" class="text-xs bg-success/20 text-success px-3 py-1.5 rounded-full hover:bg-success/30 transition">
                        <i class="fas fa-check-circle"></i> All Present
                    </button>
                    <button id="saveAttendanceBtn" class="bg-primary text-white px-5 py-2 rounded-xl hover:bg-blue-700 transition font-medium">
                        <i class="fas fa-save mr-1"></i> Save
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto" style="max-height: 60vh; overflow-y: auto;">
                <table class="w-full">
                    <thead class="sticky top-0 bg-gray-50 z-10 border-b">
                        <tr class="text-left text-sm font-semibold text-gray-600">
                            <th class="px-4 py-3 w-12">#</th>
                            <th class="px-4 py-3">Student Name</th>
                            <th class="px-4 py-3">Roll No</th>
                            <th class="px-4 py-3 text-center">Attendance Status</th>
                            <th class="px-4 py-3">Remark</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr><td colspan="5" class="text-center py-12 text-gray-400"><i class="fas fa-hand-pointer text-3xl mb-2 block"></i>Select class, section & date, then click Load</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getFirestore, collection, query, getDocs, doc, setDoc, where, orderBy, getDoc, writeBatch, Timestamp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCA6d95VTLNo_FAEzJCoOzuEhHCl5LeSqk",
            authDomain: "school-menejment.firebaseapp.com",
            projectId: "school-menejment",
            storageBucket: "school-menejment.firebasestorage.app",
            messagingSenderId: "348342436525",
            appId: "1:348342436525:web:c339fe6216c4516aa3bc24"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allClasses = [];
        let sectionsCache = {};
        let classOptionsMap = {};
        let currentStudents = [];
        let attendanceRecords = {};
        let currentClassId = null;
        let currentSection = null;
        let currentDate = null;
        let currentSession = "2025-2026";
        let nextSession = "2026-2027";

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');
            toastIcon.className = type === 'success'
                ? 'fas fa-check-circle text-success text-lg'
                : 'fas fa-exclamation-circle text-danger text-lg';
            toastText.innerText = msg;
            toast.classList.remove('hidden');
            toast.style.display = 'flex';
            setTimeout(() => {
                toast.classList.add('hidden');
                setTimeout(() => { toast.style.display = 'none'; }, 300);
            }, 2800);
        }
        window.hideToast = () => document.getElementById('toast').classList.add('hidden');

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
        }

        function getViewingSession() {
            return document.getElementById('sessionSelect').value === 'current' ? currentSession : nextSession;
        }

        async function loadSession() {
            try {
                const s = await getDoc(doc(db, "config", "activeSession"));
                if (s.exists()) {
                    currentSession = s.data().sessionName || currentSession;
                }
                const parts = currentSession.split('-');
                nextSession = parts.length === 2 ? `${parseInt(parts[0]) + 1}-${parseInt(parts[1]) + 1}` : "2026-2027";
                document.getElementById('session_badge').innerHTML = `<span class="session-badge"><i class="fas fa-database mr-1"></i> ${currentSession}</span>`;
            } catch(e) {
                document.getElementById('session_badge').innerHTML = `<span class="session-badge">${currentSession}</span>`;
            }
        }

        async function loadClasses() {
            try {
                const q = query(collection(db, "classes"), orderBy("order", "asc"));
                const snap = await getDocs(q);
                const select = document.getElementById('classSelect');
                select.innerHTML = '<option value="">-- Select Class --</option>';
                allClasses = [];
                snap.forEach(docSnap => {
                    const cls = { id: docSnap.id, name: docSnap.data().name };
                    allClasses.push(cls);
                    classOptionsMap[cls.id] = cls.name;
                    select.appendChild(new Option(cls.name, cls.id));
                });
            } catch (err) {
                console.error(err);
                showToast("Error loading classes", "error");
            }
        }

        async function getSections(classId) {
            if (!classId) return [];
            if (sectionsCache[classId]) return sectionsCache[classId];
            try {
                const snap = await getDocs(query(collection(db, "sections"), where("classId", "==", classId)));
                const sections = [];
                snap.forEach(docSnap => sections.push({ id: docSnap.id, name: docSnap.data().name }));
                sectionsCache[classId] = sections;
                return sections;
            } catch (err) {
                console.error(err);
                return [];
            }
        }

        async function updateSectionDropdown(classId) {
            const sectionSelect = document.getElementById('sectionSelect');
            if (!classId) {
                sectionSelect.innerHTML = '<option value="">First select class</option>';
                sectionSelect.disabled = true;
                return;
            }
            const sections = await getSections(classId);
            sectionSelect.disabled = false;
            sectionSelect.innerHTML = '<option value="">-- Select Section --</option>';
            sections.forEach(sec => sectionSelect.appendChild(new Option(sec.name, sec.name)));
        }

        // 🔥 Load students from SESSION DATA only
        async function loadStudentsByClassSection(classId, sectionName) {
            const students = [];
            const targetSession = getViewingSession();
            
            try {
                const studRef = collection(db, `current_session/${targetSession}/classes/${classId}/students`);
                const studSnap = await getDocs(studRef);
                
                for (const docSnap of studSnap.docs) {
                    const data = docSnap.data();
                    const studentSection = data.section || "";
                    
                    if (sectionName && studentSection !== sectionName) continue;
                    if (document.getElementById('sessionSelect').value === 'current' && data.promotedToNextSession === true) continue;
                    
                    students.push({
                        id: docSnap.id,
                        name: data.fullName || data.name || "Unnamed",
                        roll: data.rollNumber || data.roll || "N/A",
                        section: studentSection,
                        classId: classId,
                        className: classOptionsMap[classId] || data.className || "Class"
                    });
                }
                
                students.sort((a, b) => (parseInt(a.roll) || 0) - (parseInt(b.roll) || 0));
                
            } catch (err) {
                console.error("Error loading students from session:", err);
            }
            
            return students;
        }

        async function loadExistingAttendance(dateStr, classId, section) {
            try {
                const targetSession = getViewingSession();
                const q = query(
                    collection(db, "attendance"),
                    where("date", "==", dateStr),
                    where("classId", "==", classId),
                    where("section", "==", section),
                    where("sessionName", "==", targetSession)
                );
                const snap = await getDocs(q);
                const records = {};
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    records[data.studentId] = {
                        status: data.status || 'absent',
                        remark: data.remark || '',
                        attendanceId: docSnap.id
                    };
                });
                return records;
            } catch (err) {
                console.warn(err);
                return {};
            }
        }

        function updateSummary(students, records) {
            const total = students.length;
            let present = 0, absent = 0, late = 0;
            students.forEach(s => {
                const status = records[s.id]?.status || 'absent';
                if (status === 'present') present++;
                else if (status === 'late') late++;
                else absent++;
            });
            document.getElementById('totalStudentsCount').innerText = total;
            document.getElementById('presentCount').innerText = present;
            document.getElementById('absentCount').innerText = absent;
            document.getElementById('lateCount').innerText = late;
        }

        function renderAttendanceTable(students, records, statusFilter = 'all') {
            const tbody = document.getElementById('attendanceTableBody');
            if (!students.length) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-gray-400"><i class="fas fa-user-graduate text-4xl mb-2 block"></i>No students found</td></tr>`;
                updateSummary(students, records);
                return;
            }

            let filtered = [...students];
            if (statusFilter !== 'all') {
                filtered = students.filter(s => (records[s.id]?.status || 'absent') === statusFilter);
            }

            let html = '';
            filtered.forEach((student, idx) => {
                const rec = records[student.id];
                const currentStatus = rec?.status || 'absent';
                const currentRemark = rec?.remark || '';
                const statusColors = {
                    present: 'bg-success/20 text-success border-success',
                    absent: 'bg-danger/20 text-danger border-danger',
                    late: 'bg-warning/20 text-warning border-warning'
                };

                html += `
                    <tr class="student-row border-b border-gray-100 hover:bg-yellow-50/40 transition">
                        <td class="px-4 py-3 text-sm text-gray-500 font-medium">${idx + 1}</td>
                        <td class="px-4 py-3">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary text-sm font-bold">${escapeHtml((student.name || 'U').charAt(0))}</div>
                                <span class="font-medium text-gray-800">${escapeHtml(student.name)}</span>
                            </div>
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-600">${escapeHtml(student.roll)}</td>
                        <td class="px-4 py-3">
                            <div class="flex flex-wrap gap-2 justify-center">
                                <button class="status-btn px-3 py-1.5 rounded-full text-xs font-medium border ${currentStatus === 'present' ? statusColors.present + ' active shadow-sm' : 'bg-gray-100 text-gray-600 border-gray-200'}" data-student="${student.id}" data-status="present"><i class="fas fa-check-circle mr-1"></i> Present</button>
                                <button class="status-btn px-3 py-1.5 rounded-full text-xs font-medium border ${currentStatus === 'absent' ? statusColors.absent + ' active shadow-sm' : 'bg-gray-100 text-gray-600 border-gray-200'}" data-student="${student.id}" data-status="absent"><i class="fas fa-times-circle mr-1"></i> Absent</button>
                                <button class="status-btn px-3 py-1.5 rounded-full text-xs font-medium border ${currentStatus === 'late' ? statusColors.late + ' active shadow-sm' : 'bg-gray-100 text-gray-600 border-gray-200'}" data-student="${student.id}" data-status="late"><i class="fas fa-clock mr-1"></i> Late</button>
                            </div>
                        </td>
                        <td class="px-4 py-3">
                            <input type="text" class="remark-input w-full text-xs border border-gray-200 rounded-lg p-1.5 focus:ring-1 focus:ring-primary" placeholder="Optional remark" data-student="${student.id}" value="${escapeHtml(currentRemark)}">
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;

            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const studentId = btn.dataset.student;
                    const newStatus = btn.dataset.status;
                    if (!attendanceRecords[studentId]) attendanceRecords[studentId] = { status: 'absent', remark: '' };
                    attendanceRecords[studentId].status = newStatus;
                    const remarkInput = document.querySelector(`.remark-input[data-student="${studentId}"]`);
                    if (remarkInput) attendanceRecords[studentId].remark = remarkInput.value;
                    renderAttendanceTable(currentStudents, attendanceRecords, document.getElementById('statusFilter').value);
                });
            });

            document.querySelectorAll('.remark-input').forEach(input => {
                input.addEventListener('change', () => {
                    const studentId = input.dataset.student;
                    if (!attendanceRecords[studentId]) attendanceRecords[studentId] = { status: 'absent', remark: '' };
                    attendanceRecords[studentId].remark = input.value;
                });
            });

            updateSummary(students, records);
        }

        async function saveAttendance() {
            if (!currentClassId || !currentSection || !currentDate) {
                showToast("Please select class, section and date first", "error");
                return;
            }
            if (currentStudents.length === 0) {
                showToast("No students to save", "error");
                return;
            }

            const targetSession = getViewingSession();
            const saveBtn = document.getElementById('saveAttendanceBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Saving...';

            try {
                const batch = writeBatch(db);
                const attendanceCol = collection(db, "attendance");

                for (const student of currentStudents) {
                    const record = attendanceRecords[student.id];
                    if (!record) continue;

                    const docId = `${targetSession}_${currentDate}_${student.id}`;
                    const docRef = doc(attendanceCol, docId);
                    batch.set(docRef, {
                        studentId: student.id,
                        studentName: student.name,
                        roll: student.roll,
                        classId: currentClassId,
                        className: student.className,
                        section: currentSection,
                        date: currentDate,
                        status: record.status,
                        remark: record.remark || '',
                        sessionName: targetSession,
                        updatedAt: Timestamp.now()
                    }, { merge: true });
                }

                await batch.commit();
                showToast(`Attendance saved (${currentStudents.length} students) for ${currentDate} (${targetSession})`, "success");
            } catch (err) {
                console.error(err);
                showToast("Error: " + err.message, "error");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save mr-1"></i> Save';
            }
        }

        function markAllPresent() {
            if (currentStudents.length === 0) return;
            currentStudents.forEach(s => {
                if (!attendanceRecords[s.id]) attendanceRecords[s.id] = { status: 'absent', remark: '' };
                attendanceRecords[s.id].status = 'present';
            });
            renderAttendanceTable(currentStudents, attendanceRecords, document.getElementById('statusFilter').value);
            showToast("All students marked as Present", "success");
        }

        async function loadAttendanceData() {
            const classId = document.getElementById('classSelect').value;
            const section = document.getElementById('sectionSelect').value;
            const date = document.getElementById('attendanceDate').value;

            if (!classId || !section || !date) {
                showToast("Please select Class, Section and Date", "error");
                return;
            }

            currentClassId = classId;
            currentSection = section;
            currentDate = date;

            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12"><i class="fas fa-spinner fa-pulse text-primary text-2xl"></i><br>Loading...</td></tr>`;

            try {
                const students = await loadStudentsByClassSection(classId, section);
                currentStudents = students;
                const existing = await loadExistingAttendance(date, classId, section);

                attendanceRecords = {};
                students.forEach(s => {
                    attendanceRecords[s.id] = existing[s.id]
                        ? { status: existing[s.id].status, remark: existing[s.id].remark || '' }
                        : { status: 'absent', remark: '' };
                });

                renderAttendanceTable(students, attendanceRecords, document.getElementById('statusFilter').value);
                showToast(`Loaded ${students.length} students from ${getViewingSession()} session`, "success");
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-red-500">Error loading data</td></tr>`;
            }
        }

        // Event Listeners
        document.getElementById('sessionSelect').addEventListener('change', () => {
            sectionsCache = {};
            document.getElementById('classSelect').value = '';
            document.getElementById('sectionSelect').innerHTML = '<option value="">First select class</option>';
            document.getElementById('sectionSelect').disabled = true;
            document.getElementById('attendanceTableBody').innerHTML = `<tr><td colspan="5" class="text-center py-12 text-gray-400">Select class, section & date then click Load</td></tr>`;
            currentStudents = [];
            attendanceRecords = {};
            updateSummary([], {});
        });

        document.getElementById('classSelect').addEventListener('change', async (e) => {
            await updateSectionDropdown(e.target.value);
            document.getElementById('sectionSelect').value = '';
            document.getElementById('attendanceTableBody').innerHTML = `<tr><td colspan="5" class="text-center py-12 text-gray-400">Select section & date then click Load</td></tr>`;
            currentStudents = [];
            attendanceRecords = {};
            updateSummary([], {});
        });

        document.getElementById('loadStudentsBtn').addEventListener('click', loadAttendanceData);
        document.getElementById('saveAttendanceBtn').addEventListener('click', saveAttendance);
        document.getElementById('markAllPresent').addEventListener('click', markAllPresent);
        document.getElementById('statusFilter').addEventListener('change', () => {
            if (currentStudents.length > 0) {
                renderAttendanceTable(currentStudents, attendanceRecords, document.getElementById('statusFilter').value);
            }
        });

        // Set default date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('attendanceDate').value = today;

        // Initialize
        await loadSession();
        await loadClasses();
    </script>
</body>
</html>
