<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | School Analytics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container {
            max-width: 1280px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ---------- NAVBAR ---------- */
        .navbar {
            background: var(--card-bg);
            padding: 0 8px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
            padding: 0 16px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-left .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: var(--radius-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .nav-left .dashboard-text {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.4px;
        }

        .session-badge {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
            white-space: nowrap;
            transition: var(--transition);
            cursor: default;
        }

        .session-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        /* ---------- METRIC CARDS ---------- */
        .info-cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .info-card {
            color: white;
            padding: 26px 24px;
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 130px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            transition: var(--transition);
        }

        .info-card::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            transition: var(--transition);
        }

        .info-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--shadow-lg);
        }

        .info-card:hover::before {
            transform: scale(1.3);
        }

        .info-card:hover::after {
            transform: scale(1.2);
        }

        .info-card .card-details {
            position: relative;
            z-index: 1;
        }

        .info-card .card-details .count {
            font-size: 40px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .info-card .card-details .label {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            opacity: 0.85;
            margin-top: 6px;
        }

        .info-card .card-icon {
            font-size: 44px;
            opacity: 0.25;
            position: relative;
            z-index: 1;
            transition: var(--transition);
        }

        .info-card:hover .card-icon {
            opacity: 0.4;
            transform: scale(1.1) rotate(-5deg);
        }

        /* Card colors */
        .card-1 { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .card-2 { background: linear-gradient(135deg, #10b981, #059669); }
        .card-3 { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .card-4 { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .card-5 { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .card-6 { background: linear-gradient(135deg, #ec4899, #db2777); }

        /* ---------- CALENDAR ---------- */
        .calendar-wrapper {
            background: var(--card-bg);
            padding: 28px 30px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .calendar-wrapper:hover {
            box-shadow: var(--shadow-lg);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .calendar-header h2 {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .calendar-header h2 i {
            color: var(--primary);
            font-size: 20px;
            background: #eef2ff;
            padding: 8px;
            border-radius: var(--radius-xs);
        }

        .calendar-nav {
            display: flex;
            gap: 8px;
        }

        .calendar-nav button {
            background: #f1f5f9;
            border: 1px solid var(--border);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-xs);
            font-size: 16px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-nav button:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .calendar-nav button:active {
            transform: scale(0.95);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-grid .day-name {
            font-weight: 700;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 10px 0 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .calendar-grid .day-cell {
            background: #f8fafc;
            border-radius: var(--radius-xs);
            padding: 10px 4px;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-primary);
            transition: var(--transition);
            cursor: default;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            position: relative;
        }

        .calendar-grid .day-cell:not(.other-month):hover {
            background: #eef2ff;
            border-color: var(--primary-light);
            transform: scale(1.05);
            z-index: 2;
            box-shadow: var(--shadow-sm);
        }

        .calendar-grid .day-cell.other-month {
            color: #cbd5e1;
            background: transparent;
            font-weight: 400;
        }

        .calendar-grid .day-cell.today {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            border-color: transparent;
        }

        .calendar-grid .day-cell.today:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.55);
        }

        .calendar-grid .day-cell.event {
            background: #fefce8;
            color: #a16207;
            font-weight: 700;
            border-color: #fde047;
        }

        .calendar-grid .day-cell.event::after {
            content: '';
            position: absolute;
            bottom: 5px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #eab308;
            box-shadow: 0 0 6px rgba(234, 179, 8, 0.6);
        }

        .calendar-grid .day-cell.event.today::after {
            background: white;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        .event-legend {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .event-legend span {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 500;
        }

        .event-legend .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .event-legend .legend-dot.event-dot {
            background: #eab308;
            box-shadow: 0 0 6px rgba(234, 179, 8, 0.5);
        }

        .event-legend .legend-dot.today-dot {
            background: var(--primary);
            box-shadow: 0 0 6px rgba(99, 102, 241, 0.5);
        }

        .event-legend .legend-range {
            margin-left: auto;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        /* ---------- LOADING OVERLAY ---------- */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.97);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(4px);
        }

        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            animation: spin 0.9s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-overlay p {
            font-size: 15px;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 1024px) {
            .info-cards-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
            .info-card {
                padding: 22px 20px;
                min-height: 115px;
            }
            .info-card .card-details .count {
                font-size: 34px;
            }
            .info-card .card-icon {
                font-size: 38px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 14px;
            }
            .dashboard-container {
                gap: 18px;
            }
            .nav-container {
                height: 64px;
                padding: 0 12px;
            }
            .nav-left .brand-icon {
                width: 36px;
                height: 36px;
                font-size: 17px;
            }
            .nav-left .dashboard-text {
                font-size: 17px;
            }
            .session-badge {
                padding: 8px 14px;
                font-size: 12px;
            }
            .info-cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .info-card {
                padding: 18px 16px;
                min-height: 100px;
                border-radius: var(--radius-sm);
            }
            .info-card .card-details .count {
                font-size: 28px;
            }
            .info-card .card-details .label {
                font-size: 10px;
                letter-spacing: 0.8px;
            }
            .info-card .card-icon {
                font-size: 30px;
            }
            .calendar-wrapper {
                padding: 20px 16px 22px;
                border-radius: var(--radius-sm);
            }
            .calendar-header h2 {
                font-size: 15px;
            }
            .calendar-header h2 i {
                font-size: 16px;
                padding: 6px;
            }
            .calendar-nav button {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            .calendar-grid .day-cell {
                font-size: 13px;
                padding: 8px 2px;
                min-height: 42px;
                border-radius: 6px;
            }
            .calendar-grid .day-name {
                font-size: 10px;
                padding: 6px 0 10px;
            }
            .event-legend {
                gap: 12px;
                font-size: 11px;
            }
            .event-legend .legend-range {
                margin-left: 0;
                width: 100%;
                justify-content: flex-start;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .dashboard-container {
                gap: 14px;
            }
            .nav-container {
                height: 56px;
                padding: 0 8px;
            }
            .nav-left {
                gap: 10px;
            }
            .nav-left .brand-icon {
                width: 32px;
                height: 32px;
                font-size: 15px;
                border-radius: 6px;
            }
            .nav-left .dashboard-text {
                font-size: 15px;
            }
            .session-badge {
                padding: 6px 10px;
                font-size: 11px;
                gap: 5px;
            }
            .session-badge span {
                display: none;
            }
            .session-badge i {
                font-size: 13px;
            }
            .info-cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .info-card {
                padding: 14px 12px;
                min-height: 85px;
                border-radius: var(--radius-xs);
            }
            .info-card .card-details .count {
                font-size: 22px;
                letter-spacing: -0.5px;
            }
            .info-card .card-details .label {
                font-size: 9px;
                letter-spacing: 0.5px;
                margin-top: 3px;
            }
            .info-card .card-icon {
                font-size: 24px;
                opacity: 0.2;
            }
            .calendar-wrapper {
                padding: 16px 10px 18px;
                border-radius: var(--radius-xs);
            }
            .calendar-header {
                margin-bottom: 14px;
            }
            .calendar-header h2 {
                font-size: 13px;
                gap: 6px;
            }
            .calendar-header h2 i {
                font-size: 13px;
                padding: 5px;
                border-radius: 6px;
            }
            .calendar-nav button {
                width: 32px;
                height: 32px;
                font-size: 12px;
                border-radius: 6px;
            }
            .calendar-grid {
                gap: 3px;
            }
            .calendar-grid .day-cell {
                font-size: 11px;
                min-height: 34px;
                padding: 4px 1px;
                border-radius: 5px;
                font-weight: 600;
            }
            .calendar-grid .day-name {
                font-size: 9px;
                padding: 4px 0 8px;
                letter-spacing: 0.3px;
            }
            .calendar-grid .day-cell.event::after {
                width: 3px;
                height: 3px;
                bottom: 3px;
            }
            .event-legend {
                gap: 8px;
                font-size: 10px;
                margin-top: 12px;
                padding-top: 12px;
            }
            .event-legend .legend-dot {
                width: 7px;
                height: 7px;
            }
            .event-legend .legend-range {
                font-size: 10px;
            }
        }

        /* ---------- SCROLLBAR ---------- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ---------- ANIMATIONS ---------- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-card {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .info-card:nth-child(1) { animation-delay: 0.05s; }
        .info-card:nth-child(2) { animation-delay: 0.1s; }
        .info-card:nth-child(3) { animation-delay: 0.15s; }
        .info-card:nth-child(4) { animation-delay: 0.2s; }
        .info-card:nth-child(5) { animation-delay: 0.25s; }
        .info-card:nth-child(6) { animation-delay: 0.3s; }

        .calendar-wrapper {
            animation: fadeInUp 0.5s ease forwards;
            animation-delay: 0.35s;
            opacity: 0;
        }

        .navbar {
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p>Loading dashboard data...</p>
    </div>

    <div class="dashboard-container">

        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-left">
                    <div class="brand-icon">
                        <i class="fas fa-chart-pie"></i>
                    </div>
                    <span class="dashboard-text">Dashboard</span>
                </div>
                <div class="nav-right">
                    <div class="session-badge" id="currentSessionDisplay">
                        <i class="fas fa-calendar-alt"></i>
                        <span id="sessionLabel">Loading...</span>
                    </div>
                </div>
            </div>
        </nav>

        <!-- METRIC CARDS -->
        <div class="info-cards-grid" id="infoCardsGrid">
            <!-- injected by JS -->
        </div>

        <!-- CALENDAR -->
        <div class="calendar-wrapper">
            <div class="calendar-header">
                <h2><i class="fas fa-calendar-check"></i> School Events Calendar</h2>
                <div class="calendar-nav">
                    <button id="prevMonthBtn" aria-label="Previous month"><i class="fas fa-chevron-left"></i></button>
                    <button id="nextMonthBtn" aria-label="Next month"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="calendar-grid" id="calendarGrid">
                <!-- generated by JS -->
            </div>

            <div class="event-legend">
                <span><span class="legend-dot event-dot"></span> Event day</span>
                <span><span class="legend-dot today-dot"></span> Today</span>
                <span class="legend-range"><i class="far fa-calendar-alt"></i> June 2026 – July 2026</span>
            </div>
        </div>

    </div>

    <script type="module">
        // ================================================================
        // FIREBASE (module import)
        // ================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            query,
            onSnapshot,
            doc,
            getDoc,
            getDocs
        } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCA6d95VTLNo_FAEzJCoOzuEhHCl5LeSqk",
            authDomain: "school-menejment.firebaseapp.com",
            databaseURL: "https://school-menejment-default-rtdb.firebaseio.com",
            projectId: "school-menejment",
            storageBucket: "school-menejment.firebasestorage.app",
            messagingSenderId: "348342436525",
            appId: "1:348342436525:web:c339fe6216c4516aa3bc24",
            measurementId: "G-SQT1N4PVD3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CACHE_KEY = 'dashboard_data_cache';
        const CACHE_TTL = 5 * 60 * 1000;

        // metric config
        const dashboardMetrics = {
            student: { id: 'totalStudent', icon: 'fa-user-graduate', label: 'TOTAL STUDENTS' },
            teacher: { id: 'totalTeacher', icon: 'fa-chalkboard-teacher', label: 'TOTAL TEACHERS' },
            admin: { id: 'totalAdmin', icon: 'fa-user-cog', label: 'TOTAL ADMINISTRATORS' },
            parent: { id: 'totalParent', icon: 'fa-hands-helping', label: 'TOTAL PARENTS' },
            superadmin: { id: 'totalSuperAdmin', icon: 'fa-user-shield', label: 'TOTAL SUPER ADMINS' },
            totalUsers: { id: 'totalUsers', icon: 'fa-users', label: 'TOTAL USERS' }
        };

        // ----- CACHE -----
        function getCachedData() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (Date.now() - parsed.timestamp > CACHE_TTL) {
                    localStorage.removeItem(CACHE_KEY);
                    return null;
                }
                return parsed.data;
            } catch { return null; }
        }

        function setCachedData(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() }));
            } catch {}
        }

        // ----- UI UPDATE -----
        function updateUI(data) {
            const mapping = {
                student: 'totalStudent',
                teacher: 'totalTeacher',
                admin: 'totalAdmin',
                parent: 'totalParent',
                superadmin: 'totalSuperAdmin',
                totalUsers: 'totalUsers'
            };
            for (const key in mapping) {
                const el = document.getElementById(mapping[key]);
                if (el) el.textContent = data[key] ?? 0;
            }
            if (data.sessionName) {
                const el = document.getElementById('sessionLabel');
                if (el) el.textContent = data.sessionName;
            }
        }

        function hideLoadingOverlay() {
            const overlay = document.getElementById('loading-overlay');
            if (!overlay) return;
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 400);
        }

        function showError(message) {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.innerHTML = `<p style="color:#ef4444;font-weight:600;">${message}</p>`;
        }

        // ----- BUILD CARDS -----
        function createDashboardCards() {
            const grid = document.getElementById('infoCardsGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const order = ['student', 'teacher', 'admin', 'parent', 'superadmin', 'totalUsers'];
            let cardIndex = 1;
            for (const key of order) {
                const metric = dashboardMetrics[key];
                if (!metric) continue;
                const card = document.createElement('div');
                card.classList.add('info-card', `card-${cardIndex++}`);
                card.innerHTML = `
                    <div class="card-details">
                        <div class="count" id="${metric.id}">0</div>
                        <div class="label">${metric.label}</div>
                    </div>
                    <i class="fas ${metric.icon} card-icon"></i>
                `;
                grid.appendChild(card);
            }
        }

        // ----- FETCH DATA -----
        async function fetchAllDataFromFirebase() {
            const sessionPromise = getDoc(doc(db, "config", "activeSession"))
                .then(snap => snap.exists() ? (snap.data().sessionName || "2025-2026") : "2025-2026")
                .catch(() => "2025-2026");

            const usersPromise = getDocs(collection(db, "users"))
                .then(snap => {
                    const counts = { admin: 0, teacher: 0, superadmin: 0 };
                    snap.forEach(d => {
                        const role = d.data().role ? String(d.data().role).toLowerCase() : null;
                        if (role === 'admin') counts.admin++;
                        else if (role === 'teacher') counts.teacher++;
                        else if (role === 'superadmin') counts.superadmin++;
                    });
                    return counts;
                })
                .catch(() => ({ admin: 0, teacher: 0, superadmin: 0 }));

            const parentsPromise = getDocs(collection(db, "parents"))
                .then(snap => snap.size)
                .catch(() => 0);

            const [sessionName, userCounts, parentCount] = await Promise.all([
                sessionPromise,
                usersPromise,
                parentsPromise
            ]);

            let studentCount = 0;
            try {
                const classesSnap = await getDocs(collection(db, "classes"));
                const studentPromises = classesSnap.docs.map(classDoc =>
                    getDocs(collection(db, `current_session/${sessionName}/classes/${classDoc.id}/students`))
                    .then(snap => snap.size)
                    .catch(() => 0)
                );
                const classCounts = await Promise.all(studentPromises);
                studentCount = classCounts.reduce((sum, c) => sum + c, 0);
            } catch (e) {
                console.error("Student count error:", e);
            }

            const totalUsers = userCounts.admin + userCounts.teacher + userCounts.superadmin + parentCount;
            return {
                student: studentCount,
                teacher: userCounts.teacher,
                admin: userCounts.admin,
                parent: parentCount,
                superadmin: userCounts.superadmin,
                totalUsers: totalUsers,
                sessionName: sessionName
            };
        }

        // ----- REALTIME LISTENER -----
        function setupRealtimeListener() {
            const q = query(collection(db, "users"));
            onSnapshot(q, async (snapshot) => {
                const counts = { admin: 0, teacher: 0, superadmin: 0 };
                snapshot.forEach((docSnap) => {
                    const role = docSnap.data().role ? String(docSnap.data().role).toLowerCase() : null;
                    if (role === 'admin') counts.admin++;
                    else if (role === 'teacher') counts.teacher++;
                    else if (role === 'superadmin') counts.superadmin++;
                });
                const adminEl = document.getElementById('totalAdmin');
                const teacherEl = document.getElementById('totalTeacher');
                const superAdminEl = document.getElementById('totalSuperAdmin');
                if (adminEl) adminEl.textContent = counts.admin;
                if (teacherEl) teacherEl.textContent = counts.teacher;
                if (superAdminEl) superAdminEl.textContent = counts.superadmin;

                const cached = getCachedData();
                const parentCount = cached ? cached.parent : 0;
                const totalUsers = counts.admin + counts.teacher + counts.superadmin + parentCount;
                const totalUsersEl = document.getElementById('totalUsers');
                if (totalUsersEl) totalUsersEl.textContent = totalUsers;
            }, (error) => {
                console.error("Realtime listener error:", error);
            });
        }

        // ----- CALENDAR -----
        function buildCalendar(year, month) {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayNames.forEach(name => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.textContent = name;
                grid.appendChild(div);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            // previous month
            const prevMonthStart = daysInPrevMonth - firstDay + 1;
            for (let i = prevMonthStart; i <= daysInPrevMonth; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.textContent = i;
                grid.appendChild(cell);
            }

            // current month
            const today = new Date();
            const isToday = (d) => today.getDate() === d && today.getMonth() === month && today.getFullYear() === year;
            const eventDays = [5, 12, 19, 26];

            for (let d = 1; d <= daysInMonth; d++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                if (isToday(d)) cell.classList.add('today');
                if (eventDays.includes(d)) cell.classList.add('event');
                cell.textContent = d;
                grid.appendChild(cell);
            }

            // next month
            const totalCells = firstDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= remaining; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.textContent = i;
                grid.appendChild(cell);
            }
        }

        let currentYear = 2026;
        let currentMonth = 5;

        function updateCalendar(year, month) {
            currentYear = year;
            currentMonth = month;
            buildCalendar(year, month);
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            const legend = document.querySelector('.event-legend .legend-range');
            if (legend) {
                const nextMonth = month === 11 ? 0 : month + 1;
                const nextYear = month === 11 ? year + 1 : year;
                legend.innerHTML =
                    `<i class="far fa-calendar-alt"></i> ${monthNames[month]} ${year} – ${monthNames[nextMonth]} ${nextYear}`;
            }
        }

        // ----- INIT -----
        function init() {
            createDashboardCards();

            const cached = getCachedData();
            if (cached) {
                updateUI(cached);
                hideLoadingOverlay();
            }

            fetchAllDataFromFirebase()
                .then(data => {
                    updateUI(data);
                    setCachedData(data);
                    if (!cached) hideLoadingOverlay();
                    setupRealtimeListener();
                })
                .catch(error => {
                    console.error("Data fetch error:", error);
                    if (!cached) showError(`Error: ${error.message}`);
                });

            // Calendar: June 2026
            updateCalendar(2026, 5);

            document.getElementById('prevMonthBtn').addEventListener('click', () => {
                let newMonth = currentMonth - 1;
                let newYear = currentYear;
                if (newMonth < 0) { newMonth = 11; newYear--; }
                updateCalendar(newYear, newMonth);
            });

            document.getElementById('nextMonthBtn').addEventListener('click', () => {
                let newMonth = currentMonth + 1;
                let newYear = currentYear;
                if (newMonth > 11) { newMonth = 0; newYear++; }
                updateCalendar(newYear, newMonth);
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
