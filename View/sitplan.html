<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sit Plan Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1a237e', accent: '#ffd54f', success: '#10b981', danger: '#ef4444', warning: '#f59e0b' } } } };
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; }

        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast-item { background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); padding: 12px 18px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; min-width: 260px; border-left: 4px solid #10b981; animation: slideIn 0.3s ease; }
        .toast-item.error { border-left-color: #ef4444; }
        .toast-item.warning { border-left-color: #f59e0b; }
        @keyframes slideIn { from { opacity:0; transform:translateX(50px); } to { opacity:1; transform:translateX(0); } }

        /* ===== SIT PLAN PAGE ===== */
        .sit-page {
            width: 210mm; height: 297mm;
            background: #fff; padding: 6mm 7mm;
            display: flex; flex-direction: column;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            margin: 0 auto 20px; overflow: hidden;
        }

        /* ===== CARD GRID — bigger gap for cutting ===== */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5mm 6mm; /* enough space to cut between cards */
            flex: 1;
        }

        /* ===== SINGLE SIT CARD ===== */
        .sit-card {
            border: 1.5px solid #1a237e;
            border-radius: 4px;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* -- Header -- */
        .sit-card-header {
            background: #1a237e; color: #fff;
            padding: 3px 8px 3px;
            display: flex; align-items: flex-start;
            justify-content: space-between; gap: 6px;
            flex-shrink: 0;
        }
        .sit-header-left { flex: 1; min-width: 0; }
        .sit-school-name {
            font-size: 7.5px; font-weight: 800;
            letter-spacing: 0.3px; text-transform: uppercase;
            line-height: 1.3; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .sit-school-address {
            font-size: 5.5px; font-weight: 400;
            opacity: 0.85; letter-spacing: 0.2px;
            line-height: 1.25; margin-top: 1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .sit-exam-badge {
            font-size: 5.5px; font-weight: 700;
            background: #ffd54f; color: #1a237e;
            padding: 2px 5px; border-radius: 2px;
            white-space: nowrap; flex-shrink: 0;
            line-height: 1.3; text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* -- Logo LEFT + Photo RIGHT -- */
        .sit-logo-photo {
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 4px 8px 2px; gap: 6px;
            flex-shrink: 0;
        }
        .sit-logo {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1.5px solid #1a237e; background: #f0f0fa;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0;
        }
        .sit-logo img { width: 100%; height: 100%; object-fit: cover; }
        .sit-logo svg { width: 20px; height: 20px; fill: none; stroke: #1a237e; stroke-width: 1.5; }

        .sit-photo {
            width: 32px; height: 40px;
            border: 1.5px solid #1a237e; background: #f5f5f5;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-radius: 2px; flex-shrink: 0;
        }
        .sit-photo img { width: 100%; height: 100%; object-fit: cover; }
        .sit-photo-placeholder { color: #ccc; font-size: 4.5px; text-align: center; line-height: 1; }
        .sit-photo-placeholder svg { width: 14px; height: 14px; opacity: 0.3; }

        /* -- Info Section — flex:1 to push footer down -- */
        .sit-info {
            padding: 3px 8px 2px;
            flex: 1 1 auto;
            min-height: 0;
            display: flex; flex-direction: column;
            justify-content: center; /* vertically center info rows */
        }
        .sit-info-row {
            display: flex; align-items: baseline;
            line-height: 1.6; border-bottom: 0.5px solid #eee;
            padding: 1px 0;
        }
        .sit-info-row:last-child { border-bottom: none; }
        .sit-label {
            font-size: 6.5px; font-weight: 700; color: #1a237e;
            white-space: nowrap; flex-shrink: 0; min-width: 60px;
        }
        .sit-sep {
            font-size: 6.5px; font-weight: 700; color: #1a237e;
            margin: 0 2px; flex-shrink: 0;
        }
        .sit-value {
            font-size: 7px; font-weight: 500; color: #222;
            flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Two column row */
        .sit-info-cols { display: flex; gap: 6px; }
        .sit-info-col { flex: 1; min-width: 0; }
        .sit-info-col .sit-info-row {
            display: flex; align-items: baseline;
            line-height: 1.6; border-bottom: 0.5px solid #eee;
            padding: 1px 0;
        }
        .sit-info-col .sit-info-row:last-child { border-bottom: none; }
        .sit-info-col .sit-label {
            font-size: 5.5px; font-weight: 700; color: #1a237e;
            white-space: nowrap; flex-shrink: 0; min-width: 52px;
        }
        .sit-info-col .sit-sep {
            font-size: 5.5px; font-weight: 700; color: #1a237e;
            margin: 0 1px; flex-shrink: 0;
        }
        .sit-info-col .sit-value {
            font-size: 6px; font-weight: 500; color: #222;
            flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* -- Footer — ALWAYS at bottom -- */
        .sit-card-footer {
            padding: 2px 8px 3px;
            display: flex; justify-content: space-between; align-items: flex-end;
            border-top: 0.5px solid #ccc;
            flex-shrink: 0;
            margin-top: auto;
        }
        .sit-footer-sign { text-align: center; width: 50px; }
        .sit-footer-sign-line { border-bottom: 0.5px dotted #888; height: 8px; }
        .sit-footer-sign-text { font-size: 4px; color: #888; font-weight: 600; margin-top: 1px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 800px) {
            .sit-page { width: 100%; height: auto; min-height: auto; padding: 4mm; }
            .card-grid { grid-template-columns: 1fr; }
        }

        /* ===== PRINT ===== */
        @media print {
            @page { size: A4; margin: 5mm; }

            html, body {
                width: 210mm; margin: 0; padding: 0;
                background: #fff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            .no-print { display: none !important; }

            .sit-page {
                width: 200mm !important;
                height: 287mm !important;
                margin: 0 !important;
                padding: 5mm 6mm !important;
                box-shadow: none !important;
                page-break-after: always !important;
                overflow: hidden !important;
            }
            .sit-page:last-child { page-break-after: avoid !important; }

            .card-grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 5mm 6mm !important;
            }

            .sit-card {
                border: 1.5px solid #1a237e !important;
                border-radius: 4px !important;
                display: flex !important;
                flex-direction: column !important;
                overflow: hidden !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .sit-card-header {
                background: #1a237e !important;
                color: #fff !important;
                display: flex !important;
                align-items: flex-start !important;
                justify-content: space-between !important;
                padding: 3px 8px 3px !important;
                flex-shrink: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .sit-exam-badge {
                background: #ffd54f !important;
                color: #1a237e !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .sit-logo-photo {
                display: flex !important;
                align-items: center !important;
                justify-content: space-between !important;
                padding: 4px 8px 2px !important;
                flex-shrink: 0 !important;
            }

            .sit-logo {
                background: #f0f0fa !important;
                border: 1.5px solid #1a237e !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .sit-photo {
                background: #f5f5f5 !important;
                border: 1.5px solid #1a237e !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .sit-info {
                flex: 1 1 auto !important;
                min-height: 0 !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                padding: 3px 8px 2px !important;
            }

            .sit-info-row {
                display: flex !important;
                align-items: baseline !important;
                line-height: 1.6 !important;
                padding: 1px 0 !important;
            }

            .sit-info-cols {
                display: flex !important;
                gap: 6px !important;
            }

            .sit-info-col .sit-info-row {
                display: flex !important;
                align-items: baseline !important;
                line-height: 1.6 !important;
                padding: 1px 0 !important;
            }

            .sit-card-footer {
                display: flex !important;
                justify-content: space-between !important;
                align-items: flex-end !important;
                flex-shrink: 0 !important;
                margin-top: auto !important;
                border-top: 0.5px solid #ccc !important;
                padding: 2px 8px 3px !important;
            }
        }

        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-state i { font-size: 48px; margin-bottom: 12px; }

        .grid-toggle { display: flex; gap: 4px; }
        .grid-toggle button {
            padding: 6px 14px; border: 2px solid #e2e8f0;
            border-radius: 8px; font-size: 12px; font-weight: 600;
            cursor: pointer; background: #fff; color: #64748b; transition: all 0.15s;
        }
        .grid-toggle button.active { border-color: #1a237e; background: #1a237e; color: #fff; }
        .grid-toggle button:hover:not(.active) { border-color: #1a237e; color: #1a237e; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

    <div id="toastContainer" class="toast-container no-print"></div>

    <div class="no-print max-w-5xl mx-auto mb-6">
        <div class="flex justify-between items-center mb-5 flex-wrap gap-3">
            <div class="flex items-center gap-3">
                <span class="bg-primary text-white p-2.5 rounded-xl shadow-lg"><i class="fas fa-th text-xl"></i></span>
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Sit Plan Card Generator</h1>
                    <p class="text-xs text-gray-500" id="schoolSubheading">Loading school info...</p>
                </div>
            </div>
            <div class="bg-white px-4 py-2 rounded-full shadow text-sm font-medium">
                <i class="fas fa-calendar-alt text-primary mr-1"></i>
                Session: <span id="sessionBadge" class="font-bold text-primary">2025-2026</span>
            </div>
        </div>
        <div class="bg-white rounded-2xl shadow-md p-5">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[130px]">
                    <label class="block text-xs font-semibold text-gray-600 mb-1"><i class="fas fa-calendar-check text-primary mr-1"></i> Session</label>
                    <select id="filterSession" class="w-full border border-gray-300 rounded-lg p-2.5 bg-white text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                        <option value="current">Current Session</option>
                        <option value="next">Next Session</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[130px]">
                    <label class="block text-xs font-semibold text-gray-600 mb-1"><i class="fas fa-file-alt text-primary mr-1"></i> Exam Type *</label>
                    <select id="filterExam" class="w-full border border-gray-300 rounded-lg p-2.5 bg-white text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                        <option value="">-- Select Exam --</option>
                        <option value="Annual Exam">Annual Exam</option>
                        <option value="Half Yearly Exam">Half Yearly Exam</option>
                        <option value="Quarterly Exam">Quarterly Exam</option>
                        <option value="Test Exam">Test Exam</option>
                        <option value="Model Test">Model Test</option>
                        <option value="Pre-Test Exam">Pre-Test Exam</option>
                        <option value="Final Exam">Final Exam</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[120px]">
                    <label class="block text-xs font-semibold text-gray-600 mb-1"><i class="fas fa-chalkboard text-primary mr-1"></i> Class *</label>
                    <select id="filterClass" class="w-full border border-gray-300 rounded-lg p-2.5 bg-white text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                        <option value="">-- Select Class --</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[120px]">
                    <label class="block text-xs font-semibold text-gray-600 mb-1"><i class="fas fa-layer-group text-primary mr-1"></i> Section</label>
                    <select id="filterSection" class="w-full border border-gray-300 rounded-lg p-2.5 bg-white text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" disabled>
                        <option value="">All Sections</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[140px]">
                    <label class="block text-xs font-semibold text-gray-600 mb-1"><i class="fas fa-calendar text-primary mr-1"></i> Exam Date</label>
                    <input type="date" id="filterExamDate" class="w-full border border-gray-300 rounded-lg p-2.5 bg-white text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1"><i class="fas fa-th text-primary mr-1"></i> Per Page</label>
                    <div class="grid-toggle">
                        <button id="grid8" class="active" data-cols="2" data-rows="4">8</button>
                        <button id="grid10" data-cols="2" data-rows="5">10</button>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="generateBtn" class="bg-primary hover:bg-indigo-900 text-white px-6 py-2.5 rounded-lg text-sm font-semibold shadow-md transition flex items-center gap-2"><i class="fas fa-magic"></i> Generate</button>
                    <button id="printBtn" class="bg-success hover:bg-green-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-md transition flex items-center gap-2 hidden"><i class="fas fa-print"></i> Print</button>
                </div>
            </div>
            <div class="mt-3 flex justify-between items-center text-sm">
                <span class="text-gray-500"><i class="fas fa-info-circle text-primary"></i> Select Exam & Class, then click Generate</span>
                <span id="studentCountInfo" class="text-xs bg-blue-100 px-3 py-1 rounded-full font-medium text-primary hidden"><i class="fas fa-users"></i> <span id="studentCountNum">0</span> students</span>
            </div>
        </div>
    </div>

    <div id="sitCardsContainer">
        <div class="empty-state no-print">
            <i class="fas fa-th-large block"></i>
            <p class="text-lg font-semibold">No Sit Plan Cards Generated Yet</p>
            <p class="text-sm mt-1">Select Exam, Class & Section above, then click <strong>Generate</strong></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getFirestore, collection, query, getDocs, doc, getDoc, where, orderBy } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCA6d95VTLNo_FAEzJCoOzuEhHCl5LeSqk",
            authDomain: "school-menejment.firebaseapp.com",
            projectId: "school-menejment",
            storageBucket: "school-menejment.firebasestorage.app",
            messagingSenderId: "348342436525",
            appId: "1:348342436525:web:c339fe6216c4516aa3bc24"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let schoolData = { name: 'ONNO ROKOM BIDDYANIKETON', address: 'Poranpur, Kazipur, Sirajganj', logo: '' };
        let allClasses = [], allParents = [], parentsMap = {};
        let currentSession = '2025-2026', nextSession = '2026-2027';
        let sectionsCache = {};
        let gridCols = 2, gridRows = 4;

        function esc(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m])); }
        function getField(data, ...fields) { for (const f of fields) { if (data[f]) return data[f]; } return ''; }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const div = document.createElement('div');
            div.className = `toast-item ${type === 'error' ? 'error' : type === 'warning' ? 'warning' : ''}`;
            const iconClass = type === 'success' ? 'fa-check-circle text-success' : type === 'warning' ? 'fa-exclamation-triangle text-warning' : 'fa-times-circle text-danger';
            div.innerHTML = `<i class="fas ${iconClass}"></i><span class="text-sm font-medium text-gray-700">${esc(msg)}</span>`;
            container.appendChild(div);
            setTimeout(() => { div.style.opacity = '0'; div.style.transition = 'opacity 0.3s'; setTimeout(() => div.remove(), 300); }, 3000);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            try { return new Date(dateStr).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }); }
            catch { return dateStr; }
        }

        async function loadSchoolData() {
            try {
                const snap = await getDoc(doc(db, "settings", "school_info"));
                if (snap.exists()) {
                    const d = snap.data();
                    schoolData.name = getField(d, 'school_name', 'schoolName', 'name') || schoolData.name;
                    schoolData.address = getField(d, 'address', 'schoolAddress') || schoolData.address;
                    schoolData.logo = getField(d, 'school_logo', 'logo', 'emblem') || '';
                }
            } catch (e) { console.warn('Could not load settings/school_info:', e); }
            document.getElementById('schoolSubheading').innerText = schoolData.name;
        }

        async function loadSessions() {
            try {
                const sdoc = await getDoc(doc(db, "config", "activeSession"));
                if (sdoc.exists()) currentSession = sdoc.data().sessionName || currentSession;
                const p = currentSession.split('-');
                nextSession = p.length === 2 ? `${parseInt(p[0])+1}-${parseInt(p[1])+1}` : '2026-2027';
            } catch (e) {}
            document.getElementById('sessionBadge').innerText = currentSession;
        }

        async function loadClasses() {
            const snap = await getDocs(query(collection(db, "classes"), orderBy("order")));
            allClasses = snap.docs.map(d => ({ id: d.id, name: d.data().name }));
            const sel = document.getElementById('filterClass');
            sel.innerHTML = '<option value="">-- Select Class --</option>';
            allClasses.forEach(c => sel.appendChild(new Option(c.name, c.id)));
        }

        async function getSections(classId) {
            if (!classId) return [];
            if (sectionsCache[classId]) return sectionsCache[classId];
            const snap = await getDocs(query(collection(db, "sections"), where("classId", "==", classId)));
            const secs = snap.docs.map(d => ({ id: d.id, name: d.data().name }));
            sectionsCache[classId] = secs;
            return secs;
        }

        async function loadAllParents() {
            const snap = await getDocs(collection(db, "parents"));
            allParents = []; parentsMap = {};
            snap.forEach(d => { const obj = { id: d.id, data: d.data() }; allParents.push(obj); parentsMap[d.id] = obj; });
        }

        function getParentInfo(parentId) {
            if (!parentId || !parentsMap[parentId]) return { father: '', mother: '', guardian: '', fPhone: '', mPhone: '', gPhone: '' };
            const d = parentsMap[parentId].data;
            return { father: d.fatherName || '', mother: d.motherName || '', guardian: d.guardianName || '', fPhone: d.fatherPhone || '', mPhone: d.motherPhone || '', gPhone: d.guardianPhone || '' };
        }

        async function loadStudents(classId, section, targetSession) {
            if (!classId) return [];
            const classMap = Object.fromEntries(allClasses.map(c => [c.id, c.name]));
            const className = classMap[classId] || '';
            const studSnap = await getDocs(collection(db, `current_session/${targetSession}/classes/${classId}/students`));
            const students = [];
            studSnap.forEach(docSnap => {
                const data = docSnap.data();
                if (section && data.section !== section) return;
                if (data.promotedToNextSession === true) return;
                students.push({ id: docSnap.id, ...data, classId: data.classId || classId, className: data.className || className, _session: targetSession });
            });
            students.sort((a, b) => (parseFloat(a.rollNumber) || 0) - (parseFloat(b.rollNumber) || 0));
            return students;
        }

        const emblemSVG = `<svg viewBox="0 0 48 48"><circle cx="24" cy="18" r="8" stroke-width="1.5"/><path d="M10 42c0-7.7 6.3-14 14-14s14 6.3 14 14" stroke-width="1.5"/><path d="M24 4v4M16 8l2 3M32 8l-2 3M12 16l3 2M36 16l-3 2" stroke-width="1.2"/><path d="M18 32l6 6 6-6" stroke-width="1.5"/></svg>`;

        function buildSitCard(student, examType, examDate, year) {
            const imageUrl = student.profileImage || student.passportPhotoURL;
            const avatarFallback = `https://ui-avatars.com/api/?background=1a237e&color=fff&name=${encodeURIComponent(student.fullName || 'S')}&size=80`;
            const logoHTML = schoolData.logo ? `<img src="${esc(schoolData.logo)}" alt="Logo">` : emblemSVG;
            const parent = getParentInfo(student.parentID);
            const guardianDisplay = parent.guardian || student.guardianName || '—';
            const examDateFormatted = examDate ? formatDate(examDate) : '';

            return `
                <div class="sit-card">
                    <div class="sit-card-header">
                        <div class="sit-header-left">
                            <div class="sit-school-name">${esc(schoolData.name)}</div>
                            <div class="sit-school-address">${esc(schoolData.address)}</div>
                        </div>
                        <div class="sit-exam-badge">${esc(examType || 'Exam')}</div>
                    </div>
                    <div class="sit-logo-photo">
                        <div class="sit-logo">${logoHTML}</div>
                        <div class="sit-photo">
                            ${imageUrl
                                ? `<img src="${esc(imageUrl)}" onerror="this.src='${avatarFallback}'">`
                                : `<div class="sit-photo-placeholder"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg></div>`
                            }
                        </div>
                    </div>
                    <div class="sit-info">
                        <div class="sit-info-row">
                            <span class="sit-label">Student Name</span>
                            <span class="sit-sep">:</span>
                            <span class="sit-value">${esc(student.fullName || '—')}</span>
                        </div>
                        <div class="sit-info-cols">
                            <div class="sit-info-col">
                                <div class="sit-info-row">
                                    <span class="sit-label">Student's ID</span>
                                    <span class="sit-sep">:</span>
                                    <span class="sit-value">${esc(student.rollNumber || student.admissionNumber || '—')}</span>
                                </div>
                            </div>
                            <div class="sit-info-col">
                                <div class="sit-info-row">
                                    <span class="sit-label">Class & Sec</span>
                                    <span class="sit-sep">:</span>
                                    <span class="sit-value">${esc(student.className || '—')}, ${esc(student.section || '—')}</span>
                                </div>
                            </div>
                        </div>
                        <div class="sit-info-cols">
                            <div class="sit-info-col">
                                <div class="sit-info-row">
                                    <span class="sit-label">Exam Date</span>
                                    <span class="sit-sep">:</span>
                                    <span class="sit-value">${examDateFormatted || '—'}</span>
                                </div>
                            </div>
                            <div class="sit-info-col">
                                <div class="sit-info-row">
                                    <span class="sit-label">Guardian</span>
                                    <span class="sit-sep">:</span>
                                    <span class="sit-value">${esc(guardianDisplay)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="sit-card-footer">
                        <div class="sit-footer-sign">
                            <div class="sit-footer-sign-line"></div>
                            <div class="sit-footer-sign-text">Guardian's Sign</div>
                        </div>
                        <div class="sit-footer-sign">
                            <div class="sit-footer-sign-line"></div>
                            <div class="sit-footer-sign-text">Class Teacher</div>
                        </div>
                        <div class="sit-footer-sign">
                            <div class="sit-footer-sign-line"></div>
                            <div class="sit-footer-sign-text">Headmaster</div>
                        </div>
                    </div>
                </div>`;
        }

        async function generateSitCards() {
            const examType = document.getElementById('filterExam').value;
            const classId = document.getElementById('filterClass').value;
            const section = document.getElementById('filterSection').value;
            const examDate = document.getElementById('filterExamDate').value;
            const sessionVal = document.getElementById('filterSession').value;
            const targetSession = sessionVal === 'next' ? nextSession : currentSession;
            const year = targetSession.split('-')[0];

            if (!examType) { showToast('Please select an Exam Type', 'warning'); return; }
            if (!classId) { showToast('Please select a Class', 'warning'); return; }

            const container = document.getElementById('sitCardsContainer');
            container.innerHTML = `<div class="no-print text-center py-16"><i class="fas fa-spinner fa-spin text-4xl text-primary"></i><p class="mt-3 text-gray-500 font-medium">Loading...</p></div>`;

            try {
                const students = await loadStudents(classId, section, targetSession);
                if (!students.length) {
                    container.innerHTML = `<div class="empty-state no-print"><i class="fas fa-user-slash block text-gray-300"></i><p class="text-lg font-semibold text-gray-400">No Students Found</p></div>`;
                    showToast('No students found', 'warning'); return;
                }

                document.getElementById('studentCountInfo').classList.remove('hidden');
                document.getElementById('studentCountNum').innerText = students.length;

                const perPage = gridCols * gridRows;
                let pagesHTML = '';

                for (let i = 0; i < students.length; i += perPage) {
                    const pageStudents = students.slice(i, i + perPage);
                    let cardsHTML = '';
                    for (const s of pageStudents) {
                        cardsHTML += buildSitCard(s, examType, examDate, year);
                    }
                    const remaining = perPage - pageStudents.length;
                    for (let r = 0; r < remaining; r++) {
                        cardsHTML += '<div class="sit-card" style="border-style:dashed;border-color:#ddd;opacity:0.15;"></div>';
                    }
                    pagesHTML += `
                        <div class="sit-page">
                            <div class="card-grid" style="grid-template-columns:repeat(${gridCols},1fr);grid-template-rows:repeat(${gridRows},1fr);">
                                ${cardsHTML}
                            </div>
                        </div>`;
                }

                container.innerHTML = pagesHTML;
                document.getElementById('printBtn').classList.remove('hidden');
                showToast(`✅ ${students.length} sit plan cards generated!`, 'success');
            } catch (e) {
                console.error('Generate error:', e);
                container.innerHTML = `<div class="empty-state no-print"><i class="fas fa-exclamation-triangle block text-red-300"></i><p class="text-lg font-semibold text-red-400">Error</p><p class="text-sm text-gray-400 mt-1">${esc(e.message)}</p></div>`;
                showToast('Failed: ' + e.message, 'error');
            }
        }

        document.querySelectorAll('.grid-toggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.grid-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gridCols = parseInt(btn.dataset.cols);
                gridRows = parseInt(btn.dataset.rows);
            });
        });

        document.getElementById('filterClass').addEventListener('change', async (e) => {
            const classId = e.target.value;
            const secSelect = document.getElementById('filterSection');
            if (!classId) { secSelect.disabled = true; secSelect.innerHTML = '<option value="">All Sections</option>'; return; }
            secSelect.disabled = false;
            secSelect.innerHTML = '<option value="">All Sections</option><option value="loading">Loading...</option>';
            const secs = await getSections(classId);
            secSelect.innerHTML = '<option value="">All Sections</option>';
            secs.forEach(sec => secSelect.appendChild(new Option(sec.name, sec.name)));
        });

        document.getElementById('generateBtn').addEventListener('click', generateSitCards);
        document.getElementById('printBtn').addEventListener('click', () => window.print());

        async function init() {
            document.getElementById('schoolSubheading').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            await Promise.all([loadSchoolData(), loadSessions(), loadClasses(), loadAllParents()]);
            document.getElementById('schoolSubheading').innerText = schoolData.name;
            showToast('✅ School data loaded from Firebase', 'success');
        }

        init();
    </script>
</body>
</html>
