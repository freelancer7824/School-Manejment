<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>শিক্ষক তালিকা | শিক্ষক ব্যবস্থাপনা</title>
    <!-- Tailwind + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#6b7280',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        indigo: '#6366f1'
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; }
        .modal-backdrop { backdrop-filter: blur(2px); background-color: rgba(0,0,0,0.4); }
        .user-row { transition: all 0.2s ease; }
        .user-row:hover { background-color: #f8fafc; }
        .toast-slide { animation: slideInRight 0.25s ease-out; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen antialiased p-4 md:p-6">

    <!-- Toast Message -->
    <div id="toast" class="fixed top-20 right-4 z-50 hidden transition-all duration-300">
        <div class="bg-white rounded-lg shadow-xl px-4 py-3 flex items-center gap-3 border-l-4 border-success toast-slide">
            <i id="toast-icon" class="fas fa-check-circle text-success text-lg"></i>
            <p id="toast-text" class="text-gray-700 text-sm font-medium">সফল হয়েছে</p>
            <button onclick="hideToast()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop transition-all">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 p-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center">
                    <i class="fas fa-trash-alt text-danger"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800">শিক্ষক মুছুন</h3>
            </div>
            <p class="text-gray-600 mb-2">আপনি কি <strong id="deleteUserName"></strong> কে স্থায়ীভাবে মুছতে চান?</p>
            <p class="text-sm text-gray-500 mb-4">এই কাজ পূর্বাবস্থায় ফেরানো যাবে না।</p>
            <div class="flex justify-end gap-3">
                <button id="cancelDelete" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">বাতিল</button>
                <button id="confirmDelete" class="px-4 py-2 bg-danger text-white rounded-lg hover:bg-red-700 transition">মুছুন</button>
            </div>
        </div>
    </div>

    <!-- Edit Teacher Modal -->
    <div id="editModal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4 overflow-auto">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full mx-auto">
            <div class="p-5 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold"><i class="fas fa-edit text-primary mr-2"></i> শিক্ষকের তথ্য সম্পাদনা</h3>
                <button onclick="closeEditModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            <form id="editTeacherForm" class="p-5 space-y-4">
                <input type="hidden" id="editTeacherId">
                
                <!-- Image Upload in Modal -->
                <div class="flex flex-col items-center mb-4">
                    <img id="editImagePreview" src="https://ui-avatars.com/api/?name=Teacher&background=3b82f6&color=fff" class="w-24 h-24 rounded-full object-cover border-4 border-gray-100 shadow-sm mb-3" alt="Preview">
                    <label class="bg-primary text-white px-4 py-2 rounded-lg cursor-pointer hover:bg-blue-700 transition text-sm">
                        <i class="fas fa-camera mr-1"></i> ছবি পরিবর্তন করুন
                        <input type="file" id="editImageFile" accept="image/*" class="hidden">
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2"><label class="block text-sm font-semibold text-gray-700">পূর্ণ নাম *</label><input type="text" id="editFullName" class="w-full border border-gray-300 rounded-lg p-2.5" required></div>
                    <div><label class="block text-sm font-semibold text-gray-700">শিক্ষক আইডি</label><input type="text" id="editEmployeeId" class="w-full border border-gray-300 rounded-lg p-2.5"></div>
                    <div><label class="block text-sm font-semibold text-gray-700">মোবাইল নম্বর *</label><input type="tel" id="editPhone" class="w-full border border-gray-300 rounded-lg p-2.5" required></div>
                    <div><label class="block text-sm font-semibold text-gray-700">ইমেইল</label><input type="email" id="editEmail" class="w-full border border-gray-300 rounded-lg p-2.5"></div>
                    <div><label class="block text-sm font-semibold text-gray-700">বিভাগ</label><input type="text" id="editDepartment" class="w-full border border-gray-300 rounded-lg p-2.5"></div>
                    <div><label class="block text-sm font-semibold text-gray-700">শিক্ষাগত যোগ্যতা</label><input type="text" id="editQualification" class="w-full border border-gray-300 rounded-lg p-2.5"></div>
                    <div><label class="block text-sm font-semibold text-gray-700">যোগদানের তারিখ</label><input type="date" id="editJoiningDate" class="w-full border border-gray-300 rounded-lg p-2.5"></div>
                </div>
                
                <div class="flex justify-end gap-3 pt-3 border-t">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-50 transition">বাতিল</button>
                    <button type="submit" id="editSubmitBtn" class="px-5 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 transition"><i class="fas fa-save mr-1"></i> হালনাগাদ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-wrap justify-between items-center mb-6 gap-3">
            <div class="flex items-center gap-3">
                <a href="#" class="bg-white p-2 rounded-full shadow-sm hover:bg-gray-50 transition">
                    <i class="fas fa-arrow-left text-primary"></i>
                </a>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800 flex items-center gap-2">
                    <span class="bg-primary text-white p-1.5 rounded-lg"><i class="fas fa-chalkboard-teacher"></i></span> 
                    শিক্ষক তালিকা
                </h1>
            </div>
            <div class="bg-white px-4 py-2 rounded-full shadow-sm text-sm font-medium text-gray-700 border border-gray-200">
                <i class="fas fa-users text-primary mr-1"></i> 
                মোট শিক্ষক: <span id="teacherCount" class="font-bold text-primary">0</span> জন
            </div>
        </header>

        <!-- Teacher List Table Card -->
        <div class="bg-white rounded-2xl shadow-md overflow-hidden">
            <div class="p-5 border-b bg-gray-50 flex justify-between items-center flex-wrap gap-2">
                <h3 class="font-bold text-gray-800"><i class="fas fa-list text-primary mr-2"></i> সকল শিক্ষকের বিস্তারিত তথ্য</h3>
                <div class="text-xs text-gray-500 bg-white px-3 py-1 rounded-full shadow-sm"><i class="fas fa-arrows-alt-h mr-1"></i> বাম-ডানে সুইপ করুন</div>
            </div>
            
            <!-- Horizontal Scroll Wrapper -->
            <div class="overflow-x-auto no-scrollbar">
                <table class="w-full min-w-[900px]"> <!-- min-width forces horizontal scroll on small screens -->
                    <thead class="bg-gray-100">
                        <tr class="text-left text-sm font-semibold text-gray-600">
                            <th class="px-5 py-3 w-12">#</th>
                            <th class="px-5 py-3 w-16">ছবি</th>
                            <th class="px-5 py-3">নাম</th>
                            <th class="px-5 py-3">আইডি</th>
                            <th class="px-5 py-3">বিভাগ</th>
                            <th class="px-5 py-3">মোবাইল</th>
                            <th class="px-5 py-3">যোগ্যতা</th>
                            <th class="px-5 py-3">যোগদান</th>
                            <th class="px-5 py-3 text-center w-28">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="teachersTableBody">
                        <tr><td colspan="9" class="text-center py-10 text-gray-400"><i class="fas fa-spinner fa-spin text-2xl"></i> ডাটা লোড হচ্ছে...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs, doc, updateDoc, deleteDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCA6d95VTLNo_FAEzJCoOzuEhHCl5LeSqk",
            authDomain: "school-menejment.firebaseapp.com",
            databaseURL: "https://school-menejment-default-rtdb.firebaseio.com",
            projectId: "school-menejment",
            storageBucket: "school-menejment.firebasestorage.app",
            messagingSenderId: "348342436525",
            appId: "1:348342436525:web:c339fe6216c4516aa3bc24",
            measurementId: "G-SQT1N4PVD3"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ===== CLOUDINARY CONFIG =====
        const CLOUD_NAME = "dhvtgzy5x"; // আপনার Cloudinary Cloud Name দিন
        const UPLOAD_PRESET = "Rosenews"; // Cloudinary থেকে Unsigned Upload Preset দিন
        
        let allTeachers = [];
        let pendingDeleteId = null;
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');
            toastIcon.className = type === 'success' ? 'fas fa-check-circle text-success text-lg' : 'fas fa-exclamation-circle text-danger text-lg';
            toastText.innerText = message;
            toast.classList.remove('hidden');
            toast.style.display = 'flex';
            setTimeout(() => {
                toast.classList.add('hidden');
                setTimeout(() => { toast.style.display = 'none'; }, 300);
            }, 4000);
        }
        
        window.hideToast = () => document.getElementById('toast').classList.add('hidden');
        
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

        // Cloudinary Image Upload Function
        async function uploadImageToCloudinary(file) {
            if (!file) return null;
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);
            
            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                return data.secure_url;
            } catch (error) {
                console.error("Cloudinary Upload Error:", error);
                showToast("ছবি আপলোডে ব্যর্থ হয়েছে!", 'error');
                return null;
            }
        }

        // Load Teachers
        async function loadTeachers() {
            try {
                const q = query(collection(db, 'teachers'), orderBy('createdAt', 'desc'));
                const snapshot = await getDocs(q);
                allTeachers = [];
                snapshot.forEach(doc => allTeachers.push({ id: doc.id, ...doc.data() }));
                
                document.getElementById('teacherCount').innerText = allTeachers.length;
                renderTeachersTable();
            } catch (error) {
                console.error('Error loading teachers:', error);
                document.getElementById('teachersTableBody').innerHTML = '<tr><td colspan="9" class="text-center py-10 text-red-400">ডাটা লোড করতে ব্যর্থ হয়েছে</td></tr>';
            }
        }

        function renderTeachersTable() {
            const tbody = document.getElementById('teachersTableBody');
            if (allTeachers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center py-10 text-gray-400"><i class="fas fa-info-circle mr-2"></i>কোন শিক্ষক নেই</td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            allTeachers.forEach((teacher, index) => {
                const defaultImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(teacher.name || 'T')}&background=3b82f6&color=fff`;
                const imgSrc = teacher.photoURL || defaultImg;
                
                const row = document.createElement('tr');
                row.className = 'user-row border-b border-gray-100';
                row.innerHTML = `
                    <td class="px-5 py-3 text-sm text-gray-500 font-medium">${index + 1}</td>
                    <td class="px-5 py-3">
                        <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(teacher.name)}" class="w-10 h-10 rounded-full object-cover border-2 border-gray-200 shadow-sm">
                    </td>
                    <td class="px-5 py-3">
                        <div class="font-semibold text-gray-800">${escapeHtml(teacher.name || 'N/A')}</div>
                        <div class="text-xs text-gray-500">${escapeHtml(teacher.email || '')}</div>
                    </td>
                    <td class="px-5 py-3 text-sm text-gray-700 font-medium">${escapeHtml(teacher.employeeId || 'N/A')}</td>
                    <td class="px-5 py-3 text-sm text-gray-700">${escapeHtml(teacher.department || 'N/A')}</td>
                    <td class="px-5 py-3 text-sm text-gray-700">${escapeHtml(teacher.phone || 'N/A')}</td>
                    <td class="px-5 py-3 text-sm text-gray-700">${escapeHtml(teacher.qualification || 'N/A')}</td>
                    <td class="px-5 py-3 text-sm text-gray-700">${teacher.joiningDate || 'N/A'}</td>
                    <td class="px-5 py-3 text-center">
                        <div class="flex gap-2 justify-center">
                            <button class="edit-teacher-btn bg-primary/10 text-primary hover:bg-primary hover:text-white p-2 rounded-lg transition" data-id="${teacher.id}">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="delete-teacher-btn bg-red-100 text-danger hover:bg-danger hover:text-white p-2 rounded-lg transition" data-id="${teacher.id}" data-name="${escapeHtml(teacher.name)}">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
            
            // Attach event listeners
            document.querySelectorAll('.edit-teacher-btn').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.id)));
            document.querySelectorAll('.delete-teacher-btn').forEach(btn => btn.addEventListener('click', () => openDeleteModal(btn.dataset.id, btn.dataset.name)));
        }

        // ===== EDIT MODAL LOGIC =====
        async function openEditModal(teacherId) {
            const teacher = allTeachers.find(t => t.id === teacherId);
            if (!teacher) return;
            
            document.getElementById('editTeacherId').value = teacherId;
            document.getElementById('editFullName').value = teacher.name || '';
            document.getElementById('editEmployeeId').value = teacher.employeeId || '';
            document.getElementById('editPhone').value = teacher.phone || '';
            document.getElementById('editEmail').value = teacher.email || '';
            document.getElementById('editDepartment').value = teacher.department || '';
            document.getElementById('editQualification').value = teacher.qualification || '';
            document.getElementById('editJoiningDate').value = teacher.joiningDate || '';
            
            const defaultImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(teacher.name || 'T')}&background=3b82f6&color=fff`;
            document.getElementById('editImagePreview').src = teacher.photoURL || defaultImg;
            document.getElementById('editImageFile').value = ''; // clear file input
            
            document.getElementById('editModal').classList.remove('hidden');
        }
        
        window.closeEditModal = () => document.getElementById('editModal').classList.add('hidden');

        // Preview Image on File Select
        document.getElementById('editImageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('editImagePreview').src = e.target.result;
                reader.readAsDataURL(file);
            }
        });

        // Submit Edit Form
        document.getElementById('editTeacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('editSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> আপডেট হচ্ছে...';

            const teacherId = document.getElementById('editTeacherId').value;
            const file = document.getElementById('editImageFile').files[0];
            
            const updateData = {
                name: document.getElementById('editFullName').value,
                employeeId: document.getElementById('editEmployeeId').value,
                phone: document.getElementById('editPhone').value,
                email: document.getElementById('editEmail').value,
                department: document.getElementById('editDepartment').value,
                qualification: document.getElementById('editQualification').value,
                joiningDate: document.getElementById('editJoiningDate').value,
                updatedAt: serverTimestamp()
            };

            try {
                // Upload image to Cloudinary if a new file is selected
                if (file) {
                    const imageUrl = await uploadImageToCloudinary(file);
                    if (imageUrl) updateData.photoURL = imageUrl;
                }

                // Update Teachers Collection
                await updateDoc(doc(db, 'teachers', teacherId), updateData);
                
                // Also sync to Users Collection if exists
                const userDocRef = doc(db, 'users', teacherId);
                await setDoc(userDocRef, {
                    name: updateData.name,
                    phone: updateData.phone,
                    email: updateData.email,
                    ...(updateData.photoURL && { photoURL: updateData.photoURL }),
                    updatedAt: serverTimestamp()
                }, { merge: true }); // merge: true prevents overwriting other user fields

                showToast('শিক্ষকের তথ্য হালনাগাদ হয়েছে!');
                closeEditModal();
                await loadTeachers();
                
            } catch (error) {
                console.error(error);
                showToast('ত্রুটি: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save mr-1"></i> হালনাগাদ করুন';
            }
        });

        // ===== DELETE MODAL LOGIC =====
        function openDeleteModal(teacherId, teacherName) {
            pendingDeleteId = teacherId;
            document.getElementById('deleteUserName').innerText = teacherName;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        document.getElementById('cancelDelete').onclick = () => {
            document.getElementById('deleteModal').classList.add('hidden');
            pendingDeleteId = null;
        };

        document.getElementById('confirmDelete').onclick = async () => {
            if (pendingDeleteId) {
                try {
                    // Delete from both collections
                    await deleteDoc(doc(db, 'teachers', pendingDeleteId));
                    await deleteDoc(doc(db, 'users', pendingDeleteId)).catch(() => {}); // catch if not in users
                    
                    showToast('শিক্ষক মুছে ফেলা হয়েছে');
                    document.getElementById('deleteModal').classList.add('hidden');
                    await loadTeachers();
                } catch (error) {
                    showToast('মুছতে সমস্যা: ' + error.message, 'error');
                } finally {
                    pendingDeleteId = null;
                }
            }
        };

        // Close modals on backdrop click
        document.getElementById('editModal').addEventListener('click', (e) => { if (e.target === document.getElementById('editModal')) closeEditModal(); });
        document.getElementById('deleteModal').addEventListener('click', (e) => { if (e.target === document.getElementById('deleteModal')) { document.getElementById('deleteModal').classList.add('hidden'); pendingDeleteId = null; } });

        // Initialize
        await loadTeachers();
    </script>
</body>
</html>
