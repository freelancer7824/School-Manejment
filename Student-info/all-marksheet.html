<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Advanced Marksheet Generator | ONNO ROKOM BIDDYANIKETON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Hind+Siliguri:wght@400;700&display=swap');
        body { background: #f1f5f9; font-family: 'Roboto', 'Hind Siliguri', sans-serif; }
        
        .marksheet-card {
            width: 210mm;
            min-height: 297mm;
            padding: 12mm;
            margin: 20px auto;
            background: white;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            color: #000;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.04;
            width: 450px;
            pointer-events: none;
            z-index: 0;
        }

        .content-wrap { position: relative; z-index: 1; }

        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th, td { border: 1px solid #000; padding: 4px 2px; text-align: center; font-size: 11px; }
        .text-left { text-align: left; padding-left: 6px; }
        
        .grade-table td { font-size: 10px; padding: 2px; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; padding: 0; }
            .marksheet-card { margin: 0; box-shadow: none; border: none; width: 100%; page-break-after: always; }
        }
    </style>
</head>
<body>

    <div class="max-w-6xl mx-auto no-print mt-6 mb-6 bg-white p-6 rounded-2xl shadow-md border border-indigo-100">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <select id="examSelect" class="border-2 p-2.5 rounded-xl font-bold bg-gray-50 outline-none focus:border-indigo-500 transition-all"></select>
            <select id="classSelect" class="border-2 p-2.5 rounded-xl font-bold bg-gray-50 outline-none focus:border-indigo-500 transition-all">
                <option value="">Select Class</option>
            </select>
            <select id="sectionSelect" class="border-2 p-2.5 rounded-xl font-bold bg-gray-50 outline-none focus:border-indigo-500 transition-all">
                <option value="">সব সেকশন</option>
            </select>
            <button id="generateBtn" class="bg-indigo-600 text-white font-bold py-2.5 rounded-xl hover:bg-indigo-700 shadow-lg transition-all active:scale-95">
                Generate Marksheets
            </button>
        </div>
        <div class="mt-4 flex flex-wrap justify-between items-center border-t pt-4 gap-4">
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search Roll or Name..." class="border-2 pl-10 p-2 rounded-xl w-64 outline-none focus:border-indigo-500">
            </div>
            <button onclick="window.print()" class="bg-emerald-600 text-white px-8 py-2.5 rounded-xl font-bold hover:bg-emerald-700 shadow-md">
                <i class="fas fa-print mr-2"></i> Print All Marksheets
            </button>
        </div>
    </div>

    <div id="allMarksheets"></div>

    <script type="module">
    
    
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { 
    getFirestore, doc, getDoc, collection, getDocs, query, where, orderBy, 
    onSnapshot // <--- Eta add korun
} from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCA6d95VTLNo_FAEzJCoOzuEhHCl5LeSqk",
            authDomain: "school-menejment.firebaseapp.com",
            projectId: "school-menejment",
            storageBucket: "school-menejment.firebasestorage.app",
            messagingSenderId: "348342436525",
            appId: "1:348342436525:web:c339fe6216c4516aa3bc24"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);



// Realtime Name Fetcher Logic
let currentSchoolName = "ONNO ROKOM BIDDYANIKETON"; // Default variable
onSnapshot(doc(db, "settings", "school_info"), (docSnap) => {
    if (docSnap.exists() && docSnap.data().school_name) {
        currentSchoolName = docSnap.data().school_name;
        
        // Header-e display korar jonno (Jodi header-e id="topName" thake)
        const topHeader = document.getElementById('topSchoolName');
        if (topHeader) topHeader.innerText = currentSchoolName;
    }
});

        function calculateGrade(obt, full) {
            if (!full || full <= 0) return { lg: "-", gp: 0 };
            const p = (obt / full) * 100;
            if (p >= 80) return { lg: "A+", gp: 5.00 };
            if (p >= 70) return { lg: "A", gp: 4.00 };
            if (p >= 60) return { lg: "A-", gp: 3.50 };
            if (p >= 50) return { lg: "B", gp: 3.00 };
            if (p >= 40) return { lg: "C", gp: 2.00 };
            if (p >= 33) return { lg: "D", gp: 1.00 };
            return { lg: "F", gp: 0.00 };
        }

        async function loadFilters() {
            const exSnap = await getDocs(collection(db, "exams"));
            const clSnap = await getDocs(query(collection(db, "classes"), orderBy("order")));
            const exSelect = document.getElementById('examSelect');
            exSelect.innerHTML = '<option value="">Select Exam</option>';
            exSnap.forEach(d => exSelect.innerHTML += `<option value="${d.id}">${d.data().name}</option>`);
            clSnap.forEach(d => document.getElementById('classSelect').innerHTML += `<option value="${d.id}">${d.data().name}</option>`);
        }

        document.getElementById('classSelect').onchange = async (e) => {
            const classId = e.target.value;
            const secSelect = document.getElementById('sectionSelect');
            if(!classId) return;
            const secSnap = await getDocs(query(collection(db, "sections"), where("classId", "==", classId)));
            secSelect.innerHTML = '<option value="">সব সেকশন</option>';
            secSnap.forEach(d => secSelect.innerHTML += `<option value="${d.data().name}">${d.data().name}</option>`);
        };

        document.getElementById('generateBtn').onclick = async () => {
            const examId = document.getElementById('examSelect').value;
            const classId = document.getElementById('classSelect').value;
            const filterSectionName = document.getElementById('sectionSelect').value;

            if(!examId || !classId) return alert("Please select Exam and Class");

            const container = document.getElementById('allMarksheets');
            container.innerHTML = "<div class='text-center mt-20'><p class='animate-pulse font-bold text-indigo-600'>ডেটা প্রসেসিং হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p></div>";

            const [setupSnap, marksSnap, subSnap, stuSnap, sessSnap] = await Promise.all([
                getDocs(collection(db, "mark_setup")),
                getDocs(query(collection(db, "marks"), where("examId", "==", examId))),
                getDocs(query(collection(db, "subjects"), where("classId", "==", classId))),
                getDocs(query(collection(db, "students"), where("classId", "==", classId))),
                getDoc(doc(db, "config", "activeSession"))
            ]);

            const activeSession = sessSnap.exists() ? sessSnap.data().sessionName : "2026-27";
            const examName = document.getElementById('examSelect').options[document.getElementById('examSelect').selectedIndex].text;
            const className = document.getElementById('classSelect').options[document.getElementById('classSelect').selectedIndex].text;

            const setupMap = {};
            setupSnap.forEach(d => setupMap[d.id] = d.data().marks);

            const subjects = {};
            subSnap.forEach(d => subjects[d.id] = d.data().name);

            const marksByStu = {};
            marksSnap.forEach(d => {
                const data = d.data();
                if(!marksByStu[data.studentId]) marksByStu[data.studentId] = [];
                marksByStu[data.studentId].push(data);
            });

            let finalHTML = "";
            const sortedStudents = stuSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.rollNumber || 0) - (b.rollNumber || 0));

            sortedStudents.forEach(stu => {
                if(filterSectionName && stu.section !== filterSectionName) return;

                const myMarks = marksByStu[stu.id] || [];
                let totalObtained = 0;
                let totalFullMarks = 0;
                let totalGP = 0;
                let isFailed = false;
                let rows = "";

                // সাবজেক্ট লিস্ট অনুযায়ী মার্ক সাজানো
                Object.keys(subjects).forEach((subId, index) => {
                    const m = myMarks.find(x => x.subjectId === subId) || { marks: {} };
                    
                    // মার্ক সেটআপ আইডি ফরম্যাট: ExamID_ClassID_SectionName_SubjectID
                    const setupId = `${examId}_${classId}_${stu.section}_${subId}`;
                    const setup = setupMap[setupId] || {};

                    const wF = setup.written?.enabled ? parseFloat(setup.written.full || 0) : 0;
                    const mF = setup.mcq?.enabled ? parseFloat(setup.mcq.full || 0) : 0;
                    const pF = setup.practical?.enabled ? parseFloat(setup.practical.full || 0) : 0;

                    const wO = m.marks?.written || 0;
                    const mO = m.marks?.mcq || 0;
                    const pO = m.marks?.practical || 0;

                    const rowTotal = parseFloat(wO) + parseFloat(mO) + parseFloat(pO);
                    const rowFull = wF + mF + pF;
                    const grade = calculateGrade(rowTotal, rowFull);

                    totalObtained += rowTotal;
                    totalFullMarks += rowFull;
                    totalGP += grade.gp;
                    if(grade.lg === "F") isFailed = true;

                    rows += `
                        <tr>
                            <td>${String(index + 1).padStart(2, '0')}</td>
                            <td class="text-left font-bold uppercase">${subjects[subId]}</td>
                            <td>${wF || '-'}</td><td>${wF ? wO : '-'}</td>
                            <td>${mF || '-'}</td><td>${mF ? mO : '-'}</td>
                            <td>${pF || '-'}</td><td>${pF ? pO : '-'}</td>
                            <td class="font-bold bg-gray-50">${rowFull || '-'}</td>
                            <td class="font-bold bg-gray-50">${rowTotal}</td>
                            <td class="font-black">${grade.lg}</td>
                            <td>${grade.gp.toFixed(2)}</td>
                            <td>-</td><td>-</td>
                        </tr>`;
                });

                const finalGPA = isFailed ? 0.00 : (totalGP / (Object.keys(subjects).length || 1));

                finalHTML += `
                <div class="marksheet-card page-break" data-name="${(stu.fullName || '').toLowerCase()}" data-roll="${stu.rollNumber || ''}">
                    <img src="https://i.ibb.co/v4mK6vW/logo.png" class="watermark">
                    <div class="content-wrap">
                        <div class="flex justify-between items-center border-b-2 border-black pb-2">
                            <img src="https://i.ibb.co/v4mK6vW/logo.png" class="w-20">
                            <div class="text-center">
<h1 class="text-2xl font-black text-indigo-900 leading-none uppercase">
    ${currentSchoolName}
</h1>
                                <p class="text-[10px] font-bold tracking-widest mt-1 uppercase">PORANPUR, KAZIPUR, SIRAJGANJ</p>
                                <div class="mt-2 bg-black text-white px-4 py-1 text-[12px] font-bold uppercase rounded-full">Academic Transcript: ${examName}</div>
                            </div>
                            <div class="w-24 h-28 border-2 border-black flex items-center justify-center text-[10px] italic text-gray-400">PASSPORT PHOTO</div>
                        </div>

                        <div class="grid grid-cols-3 gap-2 mt-4 text-[11px] font-bold uppercase">
                            <div class="border-b border-gray-300 pb-1">STUDENT NAME: <span class="font-normal ml-1">${stu.fullName || '-'}</span></div>
                            <div class="border-b border-gray-300 pb-1">CLASS: <span class="font-normal ml-1">${className}</span></div>
                            <div class="border-b border-gray-300 pb-1">ROLL NO: <span class="font-normal ml-1">${stu.rollNumber || '-'}</span></div>
                            <div class="border-b border-gray-300 pb-1">SECTION: <span class="font-normal ml-1">${stu.section || 'N/A'}</span></div>
                            <div class="border-b border-gray-300 pb-1">STUDENT ID: <span class="font-normal ml-1">${stu.admissionNo || stu.studentId || '-'}</span></div>
                            <div class="border-b border-gray-300 pb-1">SESSION: <span class="font-normal ml-1">${activeSession}</span></div>
                        </div>

                        <table class="mt-4">
                            <thead class="bg-gray-100">
                                <tr>
                                    <th rowspan="2">SL</th><th rowspan="2" class="w-44">SUBJECT NAME</th>
                                    <th colspan="2">WRITTEN</th><th colspan="2">MCQ</th><th colspan="2">PRAC.</th>
                                    <th colspan="2">TOTAL</th><th rowspan="2">LG</th><th rowspan="2">GP</th><th rowspan="2">HI</th><th rowspan="2">POS</th>
                                </tr>
                                <tr class="text-[9px]">
                                    <th>Full</th><th>Obt</th><th>Full</th><th>Obt</th><th>Full</th><th>Obt</th><th>Full</th><th>Obt</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                            <tfoot class="bg-gray-50 font-bold">
                                <tr>
                                    <td colspan="2" class="text-left py-2 px-2 uppercase">Total: ${totalObtained} / ${totalFullMarks}</td>
                                    <td colspan="4">GPA: ${finalGPA.toFixed(2)}</td>
                                    <td colspan="4">LETTER GRADE: ${isFailed ? 'F' : calculateGrade(totalObtained, totalFullMarks).lg}</td>
                                    <td colspan="4">RESULT: <span class="${isFailed ? 'text-red-600' : 'text-emerald-700'}">${isFailed ? 'FAILED' : 'PASSED'}</span></td>
                                </tr>
                            </tfoot>
                        </table>

                        <div class="grid grid-cols-2 gap-4 mt-4">
                            <div>
                                <table class="grade-table">
                                    <tr class="bg-gray-100 font-bold uppercase"><td>Personal Traits</td><td>Rating</td></tr>
                                    <tr><td class="text-left">Attendance & Punctuality</td><td></td></tr>
                                    <tr><td class="text-left">Cleanliness & Neatness</td><td></td></tr>
                                    <tr><td class="text-left">Behavior & Cooperation</td><td></td></tr>
                                    <tr><td class="text-left">Active Participation</td><td></td></tr>
                                </table>
                            </div>
                            <div>
                                <table class="grade-table">
                                    <tr class="bg-gray-100 font-bold uppercase"><td>Range</td><td>Grade</td><td>GPA</td></tr>
                                    <tr><td>80-100</td><td>A+</td><td>5.00</td></tr>
                                    <tr><td>70-79</td><td>A</td><td>4.00</td></tr>
                                    <tr><td>60-69</td><td>A-</td><td>3.50</td></tr>
                                    <tr><td>50-59</td><td>B</td><td>3.00</td></tr>
                                    <tr><td>40-49</td><td>C</td><td>2.00</td></tr>
                                    <tr><td>33-39</td><td>D</td><td>1.00</td></tr>
                                    <tr><td>00-32</td><td>F</td><td>0.00</td></tr>
                                </table>
                            </div>
                        </div>

                        <div class="mt-6 border border-black p-2 text-[10px]">
                            <div class="flex border-b border-black mb-2 pb-1"><span class="font-bold w-40">CLASS TEACHER'S REMARK:</span><span></span></div>
                            <div class="flex pt-1"><span class="font-bold w-40">PRINCIPAL'S REMARK:</span><span></span></div>
                        </div>

                        <div class="mt-16 flex justify-between px-6">
                            <div class="text-center border-t border-black pt-1 w-40 font-bold text-[10px] uppercase">Class Teacher</div>
                            <div class="text-center border-t border-black pt-1 w-40 font-bold text-[10px] uppercase">Guardian</div>
                            <div class="text-center border-t border-black pt-1 w-40 font-bold text-[10px] uppercase">Principal</div>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = finalHTML || "<p class='text-center mt-20'>No Data Found</p>";
        };

        // Live Search Logic
        document.getElementById('searchInput').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('.marksheet-card').forEach(card => {
                const name = card.dataset.name || "";
                const roll = card.dataset.roll || "";
                card.style.display = (name.includes(val) || roll.includes(val)) ? "block" : "none";
            });
        };

        loadFilters();
    </script>
    
    
    
</body>
</html>
