<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Student Manager | Session Data Only | Parent Connection Preserved</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>tailwind.config={theme:{extend:{colors:{primary:'#3b82f6',success:'#10b981',danger:'#ef4444',warning:'#f59e0b'}}}};</script>
    <style>
        body { background: #f1f5f9; font-family: system-ui, -apple-system, 'Segoe UI', Roboto; }
        .dropdown-menu { transition: opacity 0.1s; }
        .session-badge { background: linear-gradient(45deg, #3b82f6, #2563eb); color: white; }
        .parent-linked { background: linear-gradient(45deg, #10b981, #059669); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

    <div id="toast" class="fixed top-20 right-5 z-50 hidden transition-all duration-300">
        <div class="bg-white rounded-xl shadow-xl px-5 py-3 flex items-center gap-3 border-l-4 border-success min-w-[240px]">
            <i id="toastIcon" class="fas fa-check-circle text-success text-lg"></i>
            <span id="toastText" class="text-gray-700 text-sm font-medium">Success</span>
            <button onclick="hideToast()" class="ml-2 text-gray-400 hover:text-gray-700"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-md w-full p-6">
            <div class="flex gap-3 items-center mb-3">
                <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center">
                    <i class="fas fa-trash-alt text-danger"></i>
                </div>
                <h3 class="text-xl font-bold">Delete Student</h3>
            </div>
            <p>Permanently delete <strong id="deleteStudentName"></strong> ?</p>
            <div class="flex justify-end gap-3 mt-5">
                <button id="cancelDelete" class="px-4 py-2 border rounded-lg">Cancel</button>
                <button id="confirmDelete" class="px-4 py-2 bg-danger text-white rounded-lg">Delete</button>
            </div>
        </div>
    </div>
    
    <div id="editModal" class="hidden fixed inset-0 z-50 overflow-auto bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white p-4 border-b flex justify-between">
                <h3 class="font-bold text-xl">
                    <i class="fas fa-edit text-primary"></i> Edit Student 
                    <span id="editLocationInfo" class="ml-2 bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-xs font-medium"></span>
                </h3>
                <button onclick="closeEditModal()" class="text-2xl">&times;</button>
            </div>
            <form id="editForm" class="p-5 space-y-4">
                <input type="hidden" id="editId">
                <input type="hidden" id="editParentId">
                <input type="hidden" id="editSessionPath">
                <div class="grid md:grid-cols-2 gap-4">
                    <div><label class="text-sm font-semibold">Full Name *</label><input id="eName" class="w-full border rounded-lg p-2" required></div>
                    <div><label class="text-sm font-semibold">Roll Number</label><input id="eRoll" class="w-full border rounded-lg p-2"></div>
                    <div><label class="text-sm font-semibold">Admission No</label><input id="eAdm" class="w-full border rounded-lg p-2"></div>
                    <div><label class="text-sm font-semibold">Gender</label><select id="eGender" class="w-full border rounded-lg p-2"><option>Male</option><option>Female</option><option>Other</option></select></div>
                    <div><label class="text-sm font-semibold">Class <span class="text-primary">*</span></label><select id="eClassId" class="w-full border rounded-lg p-2" required></select></div>
                    <div><label class="text-sm font-semibold">Section <span class="text-primary">*</span></label><select id="eSection" class="w-full border rounded-lg p-2" required><option value="">-- Select Section --</option></select></div>
                    <div><label class="text-sm font-semibold">Phone</label><input id="ePhone" class="w-full border rounded-lg p-2"></div>
                    <div><label class="text-sm font-semibold">Email</label><input id="eEmail" class="w-full border rounded-lg p-2"></div>
                    <div class="md:col-span-2"><label class="text-sm font-semibold">Address</label><textarea id="eAddress" rows="2" class="w-full border rounded-lg p-2"></textarea></div>
                    <div><label class="text-sm font-semibold">Status</label><select id="eStatus" class="w-full border rounded-lg p-2"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
                </div>
                <div class="border-t pt-3 mt-2">
                    <h4 class="font-bold text-primary mb-2"><i class="fas fa-users"></i> Parent / Guardian Details</h4>
                    <div class="grid md:grid-cols-2 gap-3">
                        <div><label>Father Name</label><input id="eFather" class="w-full border rounded p-2"></div>
                        <div><label>Father Phone</label><input id="eFatherPhone" class="w-full border rounded p-2"></div>
                        <div><label>Mother Name</label><input id="eMother" class="w-full border rounded p-2"></div>
                        <div><label>Mother Phone</label><input id="eMotherPhone" class="w-full border rounded p-2"></div>
                        <div><label>Guardian Name</label><input id="eGuardian" class="w-full border rounded p-2"></div>
                        <div><label>Guardian Phone</label><input id="eGuardianPhone" class="w-full border rounded p-2"></div>
                        <div class="md:col-span-2"><label>Parent Login Email</label><input id="eParentEmail" class="w-full border rounded p-2"></div>
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 border rounded-lg">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-primary text-white rounded-lg">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="profileModal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 overflow-auto">
        <div class="bg-white rounded-2xl max-w-2xl w-full">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-xl"><i class="fas fa-id-card text-primary"></i> Student Profile</h3>
                <button onclick="closeProfileModal()" class="text-2xl">&times;</button>
            </div>
            <div id="profileContent" class="p-5"></div>
        </div>
    </div>

    <div id="parentProfileModal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
                <h3 class="font-bold text-lg"><i class="fas fa-address-card text-primary"></i> Parent Information</h3>
                <button onclick="closeParentProfileModal()" class="text-2xl text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <div id="parentProfileContent" class="p-5"></div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-5 flex-wrap gap-3">
            <div class="flex items-center gap-3">
                <span class="bg-primary text-white p-2 rounded-xl"><i class="fas fa-users text-xl"></i></span>
                <h1 class="text-2xl font-bold text-gray-800">Student Dashboard</h1>
            </div>
            <div class="bg-white px-4 py-2 rounded-full shadow text-sm font-medium">
                <i class="fas fa-calendar-alt text-primary mr-1"></i>
                <span id="sessionBadge">2025-2026</span> → <span id="nextBadge">2026-2027</span>
            </div>
        </div>
        
        <div class="bg-white rounded-2xl shadow-md p-5 mb-6">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-xs font-semibold text-gray-600">Session View</label>
                    <select id="sessionView" class="w-full border rounded-lg p-2 bg-white text-sm">
                        <option value="current">Current Session</option>
                        <option value="next">Next Session</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[130px]">
                    <label class="block text-xs font-semibold text-gray-600">Class</label>
                    <select id="filterClass" class="w-full border rounded-lg p-2">
                        <option value="">All Classes</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[130px]">
                    <label class="block text-xs font-semibold text-gray-600">Section</label>
                    <select id="filterSection" class="w-full border rounded-lg p-2" disabled>
                        <option>Select class first</option>
                    </select>
                </div>
                <div class="flex-[2]">
                    <label class="block text-xs font-semibold text-gray-600">Search</label>
                    <input id="searchInput" type="text" placeholder="Name, Roll, Phone..." class="w-full border rounded-lg p-2">
                </div>
                <div class="flex gap-2">
                    <button id="refreshBtn" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button id="gotoPromoBtn" class="bg-orange-100 text-orange-700 px-4 py-2 rounded-lg text-sm font-medium">
                        <i class="fas fa-arrow-up"></i> Promote
                    </button>
                </div>
            </div>
            <div class="mt-3 flex justify-between items-center text-sm">
                <span class="text-gray-500">
                    Total: <span id="totalCountSpan" class="font-bold text-primary">0</span> students 
                </span>
                <span class="text-xs bg-blue-100 px-2 py-1 rounded-full">
                    <i class="fas fa-database"></i> Session Data Only | Parent Connection Preserved
                </span>
            </div>
        </div>
        
        <div class="bg-white rounded-2xl shadow-md overflow-hidden">
            <div class="overflow-x-auto" style="max-height: 68vh;">
                <table class="w-full text-sm">
                    <thead class="sticky top-0 bg-gray-50 border-b z-10">
                        <tr class="text-left text-gray-600">
                            <th class="px-4 py-3 w-10">#</th>
                            <th class="px-4 py-3">Student</th>
                            <th class="px-4 py-3">Parent/Guardian</th>
                            <th class="px-4 py-3">Contact</th>
                            <th class="px-4 py-3">Class/Section</th>
                            <th class="px-4 py-3 w-24 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <tr><td colspan="6" class="text-center py-12"><i class="fas fa-spinner fa-spin text-2xl text-primary"></i><p class="mt-2">Loading...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { 
            getFirestore, collection, query, getDocs, doc, updateDoc, deleteDoc, 
            getDoc, where, orderBy, setDoc 
        } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCA6d95VTLNo_FAEzJCoOzuEhHCl5LeSqk", 
            authDomain: "school-menejment.firebaseapp.com", 
            projectId: "school-menejment", 
            storageBucket: "school-menejment.firebasestorage.app", 
            messagingSenderId: "348342436525", 
            appId: "1:348342436525:web:c339fe6216c4516aa3bc24" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let sessionStudents = [], allClasses = [], sectionsCache = {}, parentCache = {};
        let currentSession = "2025-2026", nextSession = "2026-2027";
        let selectedStudentIdForDelete = null;

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').innerText = msg;
            const icon = document.getElementById('toastIcon');
            icon.className = type === 'success' ? 'fas fa-check-circle text-success text-lg' : 
                            type === 'warning' ? 'fas fa-exclamation-triangle text-warning text-lg' : 
                            'fas fa-exclamation-triangle text-danger text-lg';
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2800);
        }

        window.hideToast = () => document.getElementById('toast').classList.add('hidden');

        function escapeHtml(str) { 
            if (!str) return ''; 
            return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); 
        }

        async function loadSessions() {
            try {
                const sdoc = await getDoc(doc(db, "config", "activeSession"));
                if (sdoc.exists()) currentSession = sdoc.data().sessionName || currentSession;
                const parts = currentSession.split('-');
                nextSession = parts.length === 2 ? `${parseInt(parts[0]) + 1}-${parseInt(parts[1]) + 1}` : "2026-2027";
            } catch (e) {}
            document.getElementById('sessionBadge').innerText = currentSession;
            document.getElementById('nextBadge').innerText = nextSession;
        }

        async function loadClasses() {
            const snap = await getDocs(query(collection(db, "classes"), orderBy("order")));
            allClasses = snap.docs.map(d => ({ id: d.id, name: d.data().name }));
            const filterClass = document.getElementById('filterClass');
            filterClass.innerHTML = '<option value="">All Classes</option>';
            allClasses.forEach(c => filterClass.appendChild(new Option(c.name, c.id)));
            
            const eClass = document.getElementById('eClassId');
            eClass.innerHTML = '<option value="">Select Class</option>';
            allClasses.forEach(c => eClass.appendChild(new Option(c.name, c.id)));
        }

        async function getSections(classId) {
            if (!classId) return [];
            if (sectionsCache[classId]) return sectionsCache[classId];
            const snap = await getDocs(query(collection(db, "sections"), where("classId", "==", classId)));
            const secs = snap.docs.map(d => ({ id: d.id, name: d.data().name }));
            sectionsCache[classId] = secs;
            return secs;
        }

        async function loadSessionDataOnly() {
            const sessionVal = document.getElementById('sessionView').value;
            let targetSession = currentSession;
            if (sessionVal === 'next') targetSession = nextSession;
            
            const classMap = Object.fromEntries(allClasses.map(c => [c.id, c.name]));
            let studentsList = [];

            try {
                const classesSnap = await getDocs(collection(db, "classes"));
                for (const classDoc of classesSnap.docs) {
                    const classId = classDoc.id;
                    const className = classDoc.data().name || classMap[classId] || '';
                    const studRef = collection(db, `current_session/${targetSession}/classes/${classId}/students`);
                    const studSnap = await getDocs(studRef);
                    
                    for (const docSnap of studSnap.docs) {
                        const data = docSnap.data();
                        if (sessionVal === 'current' && data.promotedToNextSession === true) continue;
                        
                        studentsList.push({
                            id: docSnap.id,
                            ...data,
                            classId: data.classId || classId,
                            className: classMap[data.classId] || data.className || className,
                            _sessionPath: `current_session/${targetSession}/classes/${classId}/students`,
                            _session: targetSession
                        });
                    }
                }
                
                studentsList.sort((a, b) => {
                    const ar = parseFloat(a.rollNumber || a.roll || 0);
                    const br = parseFloat(b.rollNumber || b.roll || 0);
                    return ar - br;
                });
                
            } catch (e) {
                console.error('Error loading session data:', e);
            }

            sessionStudents = studentsList;
            return sessionStudents;
        }

        async function getParentData(parentId) {
            if (!parentId) return null;
            if (parentCache[parentId]) return parentCache[parentId];
            try {
                const p = await getDoc(doc(db, "parents", parentId));
                if (p.exists()) {
                    const d = p.data();
                    const data = { 
                        father: d.fatherName || '', 
                        mother: d.motherName || '', 
                        guardian: d.guardianName || '', 
                        fPhone: d.fatherPhone || '', 
                        mPhone: d.motherPhone || '', 
                        gPhone: d.guardianPhone || '', 
                        email: d.loginEmail || '', 
                        address: d.address || '',
                        parentId: parentId
                    };
                    parentCache[parentId] = data;
                    return data;
                }
            } catch (e) {}
            return null;
        }

        async function renderFilteredTable() {
            const classId = document.getElementById('filterClass').value;
            const section = document.getElementById('filterSection').value;
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let filtered = [...sessionStudents];
            
            if (classId) filtered = filtered.filter(s => s.classId === classId);
            if (section) filtered = filtered.filter(s => s.section === section);
            if (search) {
                filtered = filtered.filter(s => 
                    (s.fullName || '').toLowerCase().includes(search) || 
                    String(s.rollNumber || '').toLowerCase().includes(search) || 
                    String(s.phone || '').includes(search)
                );
            }
            
            document.getElementById('totalCountSpan').innerText = filtered.length;
            
            const tbody = document.getElementById('studentTableBody');
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-gray-400"><i class="fas fa-user-slash text-3xl"></i><p>No students found</p></td></tr>';
                return;
            }

            tbody.innerHTML = '';
            for (let i = 0; i < filtered.length; i++) {
                const s = filtered[i];
                const parent = await getParentData(s.parentID);
                
                const row = tbody.insertRow();
                row.className = 'border-b hover:bg-gray-50';
                row.innerHTML = `
                    <td class="px-4 py-3 text-gray-500">${i + 1}</td>
                    <td class="px-4 py-3">
                        <div class="font-semibold">${escapeHtml(s.fullName || '—')}</div>
                        <div class="text-xs text-gray-400 mt-1">
                            <span class="bg-green-50 px-2 py-0.5 rounded-full">${escapeHtml(s.status || 'active')}</span> | 
                            ${escapeHtml(s.gender || '')}
                            <span class="ml-2 session-badge px-2 py-0.5 rounded-full text-xs">${escapeHtml(s._session || currentSession)}</span>
                            ${s.parentID ? '<span class="ml-1 parent-linked px-2 py-0.5 rounded-full text-xs text-white"><i class="fas fa-link"></i> Parent Linked</span>' : ''}
                        </div>
                    </td>
                    <td class="px-4 py-2 text-sm">
                        <div><i class="fas fa-user w-5 text-primary"></i> ${escapeHtml(parent?.father || s.fatherName || 'N/A')}</div>
                        <div class="mt-1"><i class="fas fa-user-check text-primary w-5"></i> ${escapeHtml(parent?.guardian || s.guardianName || 'N/A')}</div>
                        ${s.parentID ? `<button class="viewParentBtn mt-2 text-primary text-xs font-medium bg-blue-50 px-2 py-1 rounded-full hover:bg-blue-100" data-pid="${s.parentID}" data-sname="${escapeHtml(s.fullName)}">
                            <i class="fas fa-table-list"></i> View Parent
                        </button>` : '<span class="text-xs text-gray-400 mt-2 inline-block">No parent linked</span>'}
                    </td>
                    <td class="px-4 py-2 text-xs">
                        📞 ${escapeHtml(s.phone || 'N/A')}<br>
                        ✉️ ${escapeHtml(String(s.email || '').slice(0,22))}
                    </td>
                    <td class="px-4 py-2">
                        <span class="bg-blue-100 px-2 py-1 rounded text-xs font-semibold">${escapeHtml(s.className || '—')}</span> - ${escapeHtml(s.section || '—')}<br>
                        <span class="text-gray-500 text-xs">Roll: ${escapeHtml(s.rollNumber || '—')}</span>
                    </td>
                    <td class="px-4 py-2 text-center relative">
                        <button class="actionToggle p-2 rounded-full hover:bg-gray-100 transition" data-id="${s.id}">
                            <i class="fas fa-ellipsis-v text-gray-600"></i>
                        </button>
                        <div id="menu-${s.id}" class="dropdown-menu hidden absolute right-0 mt-2 w-40 bg-white rounded-xl shadow-xl border z-30 overflow-hidden">
                            <button class="viewProfile w-full text-left px-4 py-2 text-sm hover:bg-gray-50 flex items-center gap-2" data-id="${s.id}">
                                <i class="fas fa-eye text-primary"></i> Profile
                            </button>
                            <button class="editStudent w-full text-left px-4 py-2 text-sm hover:bg-gray-50 flex items-center gap-2" data-id="${s.id}">
                                <i class="fas fa-pen text-warning"></i> Edit
                            </button>
                            <hr class="my-1">
                            <button class="deleteStudent w-full text-left px-4 py-2 text-sm text-danger hover:bg-red-50 flex items-center gap-2" data-id="${s.id}">
                                <i class="fas fa-trash-alt"></i> Delete
                            </button>
                        </div>
                    </td>`;
            }
            attachTableEvents();
        }

        function closeAllMenus() { 
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.add('hidden')); 
        }

        function toggleMenuHandler(e) { 
            e.stopPropagation(); 
            const btn = e.currentTarget; 
            const menu = document.getElementById(`menu-${btn.dataset.id}`); 
            closeAllMenus(); 
            if (menu) { 
                menu.classList.remove('hidden'); 
                const closeHandler = (e2) => { 
                    if (!menu.contains(e2.target) && !btn.contains(e2.target)) { 
                        menu.classList.add('hidden'); 
                        document.removeEventListener('click', closeHandler); 
                    } 
                }; 
                setTimeout(() => document.addEventListener('click', closeHandler), 10); 
            } 
        }

        function attachTableEvents() {
            document.querySelectorAll('.actionToggle').forEach(btn => btn.addEventListener('click', toggleMenuHandler));
            document.querySelectorAll('.viewProfile').forEach(btn => btn.addEventListener('click', () => { closeAllMenus(); openProfile(btn.dataset.id); }));
            document.querySelectorAll('.editStudent').forEach(btn => btn.addEventListener('click', () => { closeAllMenus(); openEditModal(btn.dataset.id); }));
            document.querySelectorAll('.deleteStudent').forEach(btn => btn.addEventListener('click', () => { 
                const student = sessionStudents.find(s => s.id === btn.dataset.id); 
                if (student) { closeAllMenus(); openDeleteModal(student.id, student.fullName); } 
            }));
            document.querySelectorAll('.viewParentBtn').forEach(btn => btn.addEventListener('click', () => { 
                const pid = btn.dataset.pid; 
                if (pid) openParentProfileTable(pid, btn.dataset.sname); 
                else showToast('No parent linked', 'warning'); 
            }));
        }

        async function openProfile(id) {
            const s = sessionStudents.find(x => x.id === id);
            if (!s) return;
            const parent = await getParentData(s.parentID);
            document.getElementById('profileContent').innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center gap-4 border-b pb-3">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-primary to-blue-600 flex items-center justify-center text-white text-2xl font-bold shadow">
                            ${s.fullName?.charAt(0) || 'S'}
                        </div>
                        <div>
                            <h2 class="text-xl font-bold">${escapeHtml(s.fullName)}</h2>
                            <p class="text-gray-500">
                                ${escapeHtml(s.className)} - ${escapeHtml(s.section)} | 
                                Roll: ${escapeHtml(s.rollNumber)} 
                            </p>
                            <p class="text-xs text-blue-600 mt-1"><i class="fas fa-database"></i> Session: ${escapeHtml(s._session || currentSession)}</p>
                            ${s.parentID ? `<p class="text-xs text-green-600 mt-1"><i class="fas fa-link"></i> Parent ID: ${escapeHtml(s.parentID)}</p>` : ''}
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <p class="font-bold text-primary">Father</p>
                            ${escapeHtml(parent?.father || s.fatherName || 'N/A')}<br>
                            📞 ${escapeHtml(parent?.fPhone || '')}
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <p class="font-bold text-primary">Mother</p>
                            ${escapeHtml(parent?.mother || s.motherName || 'N/A')}<br>

        async function openEditModal(id) {
            const s = sessionStudents.find(x => x.id === id);
            if (!s) { showToast('Student not found', 'error'); return; }
            
            const parent = await getParentData(s.parentID);
            const locationInfo = `${s._session || currentSession} Session`;
            
            document.getElementById('editId').value = s.id;
            document.getElementById('editParentId').value = s.parentID || '';
            document.getElementById('editSessionPath').value = s._sessionPath || '';
            document.getElementById('editLocationInfo').innerText = locationInfo;
            
            document.getElementById('eName').value = s.fullName || '';
            document.getElementById('eRoll').value = s.rollNumber || '';
            document.getElementById('eAdm').value = s.admissionNumber || '';
            document.getElementById('eGender').value = s.gender || 'Male';
            document.getElementById('ePhone').value = s.phone || '';
            document.getElementById('eEmail').value = s.email || '';
            document.getElementById('eAddress').value = s.address || '';
            document.getElementById('eStatus').value = s.status || 'active';
            
            document.getElementById('eFather').value = parent?.father || s.fatherName || '';
            document.getElementById('eFatherPhone').value = parent?.fPhone || '';
            document.getElementById('eMother').value = parent?.mother || s.motherName || '';
            document.getElementById('eMotherPhone').value = parent?.mPhone || '';
            document.getElementById('eGuardian').value = parent?.guardian || s.guardianName || '';
            document.getElementById('eGuardianPhone').value = parent?.gPhone || '';

        async function updateEditSectionDropdown(classId) {
            const secSelect = document.getElementById('eSection');
            if (!classId) { 
                secSelect.disabled = true; 
                secSelect.innerHTML = '<option value="">Select class first</option>'; 
                return; 
            }
            const secs = await getSections(classId);
            secSelect.disabled = false;
            secSelect.innerHTML = '<option value="">-- Select Section --</option>';
            secs.forEach(sec => secSelect.appendChild(new Option(sec.name, sec.name)));
        }

        document.getElementById('eClassId').addEventListener('change', e => updateEditSectionDropdown(e.target.value));

        // এই ফাংশনটি replace করুন আপনার saveStudentEdit ফাংশনের জায়গায়
async function saveStudentEdit(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const newClassId = document.getElementById('eClassId').value;
    const newSection = document.getElementById('eSection').value;
    const className = allClasses.find(c => c.id === newClassId)?.name || '';
    
    if (!newClassId || !newSection) {
        showToast('Please select both Class and Section', 'error');
        return;
    }
    
    const oldSessionPath = document.getElementById('editSessionPath').value;
    const parentId = document.getElementById('editParentId').value;
    const sessionVal = document.getElementById('sessionView').value;
    let targetSession = currentSession;
    if (sessionVal === 'next') targetSession = nextSession;
    
    // Get old student data to check if class/section changed
    const oldStudent = sessionStudents.find(s => s.id === id);
    const oldClassId = oldStudent?.classId;
    const oldSection = oldStudent?.section;
    
    const studentUpdate = {
        fullName: document.getElementById('eName').value,
        rollNumber: document.getElementById('eRoll').value,
        admissionNumber: document.getElementById('eAdm').value,
        gender: document.getElementById('eGender').value,
        classId: newClassId,
        section: newSection,
        className,
        phone: document.getElementById('ePhone').value,
        email: document.getElementById('eEmail').value,
        address: document.getElementById('eAddress').value,
        status: document.getElementById('eStatus').value,
        fatherName: document.getElementById('eFather').value,
        motherName: document.getElementById('eMother').value,
        guardianName: document.getElementById('eGuardian').value,
        fatherPhone: document.getElementById('eFatherPhone').value,
        motherPhone: document.getElementById('eMotherPhone').value,
        guardianPhone: document.getElementById('eGuardianPhone').value,
        parentID: parentId,
        updatedAt: new Date().toISOString()
    };
    
    try {
        // If class OR section changed, need to move the student
        if (oldClassId !== newClassId || oldSection !== newSection) {
            console.log(`🔄 Moving student from ${oldClassId}/${oldSection} to ${newClassId}/${newSection}`);
            
            // 1. Delete from old location
            if (oldSessionPath) {
                await deleteDoc(doc(db, oldSessionPath, id));
                console.log(`✅ Deleted from old path: ${oldSessionPath}`);
            }
            
            // 2. Create new session path
            const newSessionPath = `current_session/${targetSession}/classes/${newClassId}/students`;
            studentUpdate.createdAt = new Date().toISOString();
            
            // 3. Save to new location
            await setDoc(doc(db, newSessionPath, id), studentUpdate);
            console.log(`✅ Created at new path: ${newSessionPath}`);
            
            // 4. Update the student's sessionPath in our local array
            const studentIndex = sessionStudents.findIndex(s => s.id === id);
            if (studentIndex !== -1) {
                sessionStudents[studentIndex]._sessionPath = newSessionPath;
                sessionStudents[studentIndex].classId = newClassId;
                sessionStudents[studentIndex].section = newSection;
                sessionStudents[studentIndex].className = className;
            }
        } else {
            // Same class/section - just update existing
            if (oldSessionPath) {
                await setDoc(doc(db, oldSessionPath, id), studentUpdate, { merge: true });
                console.log(`✅ Updated at same path: ${oldSessionPath}`);
            } else {
                // If no session path found, create new (should not happen normally)
                const newSessionPath = `current_session/${targetSession}/classes/${newClassId}/students`;
                await setDoc(doc(db, newSessionPath, id), studentUpdate);
            }
        }
        
        // Update parent data if needed (still in parents collection - this is fine)
        if (parentId) {
            await setDoc(doc(db, 'parents', parentId), {
                fatherName: document.getElementById('eFather').value,
                fatherPhone: document.getElementById('eFatherPhone').value,
                motherName: document.getElementById('eMother').value,
                motherPhone: document.getElementById('eMotherPhone').value,
                guardianName: document.getElementById('eGuardian').value,
                guardianPhone: document.getElementById('eGuardianPhone').value,
                loginEmail: document.getElementById('eParentEmail').value
            }, { merge: true });
            parentCache[parentId] = null;
        }
        
        closeEditModal();
        showToast('✅ Student updated successfully! (Session Data Only)', 'success');
        await refreshAll();
        
    } catch (err) {
        console.error('Update error:', err);
        showToast(err.message || 'Update failed', 'error');
    }
}

        function openDeleteModal(id, name) { 
            selectedStudentIdForDelete = id; 
            document.getElementById('deleteStudentName').innerText = name; 
            document.getElementById('deleteModal').classList.remove('hidden'); 
        }

        document.getElementById('confirmDelete').onclick = async () => { 
            if (selectedStudentIdForDelete) { 
                try {
                    const student = sessionStudents.find(s => s.id === selectedStudentIdForDelete);
                    if (student?._sessionPath) {
                        await deleteDoc(doc(db, student._sessionPath, selectedStudentIdForDelete));
                        showToast('Student deleted successfully', 'success'); 
                        document.getElementById('deleteModal').classList.add('hidden'); 
                        await refreshAll(); 
                    } else {
                        showToast('Student not found in session', 'error');
                    }
                } catch (e) { 
                    showToast(e.message, 'error'); 
                } 
                selectedStudentIdForDelete = null; 
            } 
        };

        document.getElementById('cancelDelete').onclick = () => { 
            document.getElementById('deleteModal').classList.add('hidden'); 
            selectedStudentIdForDelete = null; 
        };

        async function refreshAll() { 
            sectionsCache = {};
            parentCache = {};
            document.getElementById('studentTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-10"><i class="fas fa-spinner fa-spin text-2xl"></i> Loading...</td></tr>';
            await loadSessionDataOnly();

        }

            const cid = e.target.value; 
            const secSelect = document.getElementById('filterSection'); 
            secSelect.value = ''; 
            if (!cid) { 
                secSelect.disabled = true; 
                secSelect.innerHTML = '<option>Select class first</option>'; 
                renderFilteredTable(); 
                return; 
            } 
            const secs = await getSections(cid); 
            secSelect.disabled = false; 
            secSelect.innerHTML = '<option value="">All Sections</option>'; 
            secs.forEach(sec => secSelect.appendChild(new Option(sec.name, sec.name)));

        document.getElementById('filterSection').addEventListener('change', () => renderFilteredTable());
        document.getElementById('searchInput').addEventListener('input', () => renderFilteredTable());
        document.getElementById('sessionView').addEventListener('change', () => refreshAll());
        document.getElementById('refreshBtn').addEventListener('click', () => refreshAll());
        document.getElementById('gotoPromoBtn').addEventListener('click', () => window.location.href = 'promotion.html');

        window.closeEditModal = () => { closeAllMenus(); document.getElementById('editModal').classList.add('hidden'); };
        window.closeProfileModal = () => document.getElementById('profileModal').classList.add('hidden');
        window.closeParentProfileModal = () => document.getElementById('parentProfileModal').classList.add('hidden');

        async function init() { 
            await loadSessions(); 
            await loadClasses(); 
            await refreshAll(); 
        }

        document.getElementById('editForm').addEventListener('submit', saveStudentEdit);
        init();
    </script>
