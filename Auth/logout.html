<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Logout | ONNO ROKOM BIDDYANIKETON</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logout-container {
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logout-card {
            background: white;
            border-radius: 32px;
            padding: 40px 35px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease;
        }

        .logout-card:hover {
            transform: translateY(-5px);
        }

        .icon-container {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 25px -5px rgba(245, 87, 108, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .icon-container i {
            font-size: 48px;
            color: white;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .user-info {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        .user-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }

        .user-info-row i {
            width: 24px;
            color: #667eea;
            font-size: 18px;
        }

        .user-info-row span {
            color: #334155;
            font-size: 14px;
            font-weight: 500;
        }

        .user-info-row .label {
            color: #64748b;
            font-weight: 400;
            min-width: 80px;
        }

        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 20px 0;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px 0 rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: white;
            color: #64748b;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(245, 87, 108, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px 0 rgba(245, 87, 108, 0.5);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
        }

        .status-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .status-message.info {
            display: block;
            background: #dbeafe;
            color: #1e40af;
        }

        .footer-links {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .footer-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #667eea;
        }

        @media (max-width: 480px) {
            .logout-card {
                padding: 30px 20px;
            }
            .button-group {
                flex-direction: column;
            }
            .btn {
                justify-content: center;
            }
            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="logout-card">
            <div class="icon-container">
                <i class="fas fa-sign-out-alt"></i>
            </div>
            
            <h1>Logging Out?</h1>
            <p class="subtitle">You are about to end your current session</p>

            <div id="userInfoSection" class="user-info" style="display: none;">
                <div class="user-info-row">
                    <i class="fas fa-user-circle"></i>
                    <span class="label">Name:</span>
                    <span id="userName">Loading...</span>
                </div>
                <div class="user-info-row">
                    <i class="fas fa-envelope"></i>
                    <span class="label">Email:</span>
                    <span id="userEmail">Loading...</span>
                </div>
                <div class="user-info-row">
                    <i class="fas fa-tag"></i>
                    <span class="label">Role:</span>
                    <span id="userRole">Loading...</span>
                </div>
            </div>

            <div id="statusMessage" class="status-message"></div>

            <div class="button-group">
                <button id="confirmLogoutBtn" class="btn btn-danger">
                    <i class="fas fa-power-off"></i> Yes, Logout
                </button>
                <button id="stayLoggedInBtn" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Cancel, Stay Logged In
                </button>
            </div>

            <div class="divider"></div>

            <div class="footer-links">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="#" id="helpBtn"><i class="fas fa-question-circle"></i> Help</a>
                <a href="privacy.html"><i class="fas fa-shield-alt"></i> Privacy</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCA6d95VTLNo_FAEzJCoOzuEhHCl5LeSqk",
            authDomain: "school-menejment.firebaseapp.com",
            databaseURL: "https://school-menejment-default-rtdb.firebaseio.com",
            projectId: "school-menejment",
            storageBucket: "school-menejment.firebasestorage.app",
            messagingSenderId: "348342436525",
            appId: "1:348342436525:web:c339fe6216c4516aa3bc24",
            measurementId: "G-SQT1N4PVD3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = null;

        const confirmBtn = document.getElementById('confirmLogoutBtn');
        const stayBtn = document.getElementById('stayLoggedInBtn');
        const userInfoSection = document.getElementById('userInfoSection');
        const userNameSpan = document.getElementById('userName');
        const userEmailSpan = document.getElementById('userEmail');
        const userRoleSpan = document.getElementById('userRole');
        const statusMessageDiv = document.getElementById('statusMessage');

        function showMessage(message, type = 'info') {
            statusMessageDiv.textContent = message;
            statusMessageDiv.className = `status-message ${type}`;
            setTimeout(() => {
                if (statusMessageDiv.className.includes(type)) {
                    statusMessageDiv.style.display = 'none';
                    statusMessageDiv.className = 'status-message';
                }
            }, 4000);
        }

        function hideMessage() {
            statusMessageDiv.style.display = 'none';
            statusMessageDiv.className = 'status-message';
        }

        // Disable buttons during logout process
        function setLoading(isLoading) {
            if (isLoading) {
                confirmBtn.disabled = true;
                stayBtn.disabled = true;
                confirmBtn.innerHTML = '<span class="loading-spinner"></span> Logging out...';
            } else {
                confirmBtn.disabled = false;
                stayBtn.disabled = false;
                confirmBtn.innerHTML = '<i class="fas fa-power-off"></i> Yes, Logout';
            }
        }

        // Load user info from Firestore
        async function loadUserInfo(uid) {
            try {
                const userDoc = await getDoc(doc(db, 'users', uid));
                if (userDoc.exists()) {
                    userData = userDoc.data();
                    userNameSpan.textContent = userData.name || 'N/A';
                    userEmailSpan.textContent = userData.email || 'N/A';
                    userRoleSpan.textContent = userData.role ? userData.role.toUpperCase() : 'USER';
                    userInfoSection.style.display = 'block';
                } else {
                    userNameSpan.textContent = 'Unknown User';
                    userEmailSpan.textContent = auth.currentUser?.email || 'N/A';
                    userRoleSpan.textContent = 'USER';
                    userInfoSection.style.display = 'block';
                }
            } catch (error) {
                console.error("Error loading user info:", error);
                userNameSpan.textContent = 'Guest User';
                userEmailSpan.textContent = auth.currentUser?.email || 'Not logged in';
                userRoleSpan.textContent = 'GUEST';
                userInfoSection.style.display = 'block';
            }
        }

        // Check authentication state on page load
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadUserInfo(user.uid);
                showMessage(`Welcome back, ${userData?.name || user.email?.split('@')[0] || 'User'}! Ready to logout?`, 'info');
            } else {
                // User already logged out or not logged in
                currentUser = null;
                userInfoSection.style.display = 'block';
                userNameSpan.textContent = 'Not Logged In';
                userEmailSpan.textContent = 'No active session';
                userRoleSpan.textContent = 'GUEST';
                showMessage('You are not currently logged in. Redirecting to login page...', 'info');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });

        // Perform logout
        async function performLogout() {
            hideMessage();
            setLoading(true);
            
            try {
                await signOut(auth);
                showMessage('✅ Logout successful! Redirecting to login page...', 'success');
                
                // Clear any stored session data from localStorage if needed
                localStorage.removeItem('rememberedPhone');
                sessionStorage.clear();
                
                // Redirect after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                
            } catch (error) {
                console.error("Logout error:", error);
                showMessage(`❌ Logout failed: ${error.message}. Please try again.`, 'error');
                setLoading(false);
            }
        }

        // Cancel logout - go back to previous page or dashboard
        function cancelLogout() {
            hideMessage();
            
            // Try to go back to previous page
            if (document.referrer && document.referrer !== window.location.href) {
                window.location.href = document.referrer;
            } else if (currentUser && userData?.role) {
                // Redirect based on role
                const role = userData.role?.toLowerCase();
                if (role === 'admin') window.location.href = 'admin.html';
                else if (role === 'teacher') window.location.href = 'teacher.html';
                else if (role === 'parent') window.location.href = 'parent_dashboard.html';
                else if (role === 'superadmin') window.location.href = 'superadmin.html';
                else window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        // Event listeners
        confirmBtn.addEventListener('click', performLogout);
        stayBtn.addEventListener('click', cancelLogout);
        
        // Help button
        document.getElementById('helpBtn').addEventListener('click', (e) => {
            e.preventDefault();
            showMessage('Need help? Please contact school administration at support@school.com', 'info');
        });

        // Handle browser back/forward buttons - prevent accidental logout
        window.addEventListener('beforeunload', (e) => {
            // Don't show confirmation if already logged out
            if (currentUser) {
                // Optional: uncomment to show confirmation on page refresh/close
                // e.preventDefault();
                // e.returnValue = '';
            }
        });
    </script>
</body>
</html>
